name: Tibia Linux client manifest

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-package-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-direct-package
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect current Linux package manifest
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Fetch package manifest
        shell: bash
        run: |
          set -euo pipefail
          readonly run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume inspect oteryn-tibia-linux-analysis >/dev/null 2>&1 || \
            docker volume create oteryn-tibia-linux-analysis

          docker run --rm \
            --network bridge \
            --env "RUN_ID=${run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 \
            sh -lc '
              set -eu
              apk add --no-cache ca-certificates curl jq >/dev/null

              root="/analysis/package-manifests/${RUN_ID}"
              mkdir -p "${root}"
              base="https://static.tibia.com/launcher/tibiaclient-linux-current"
              manifest_url="${base}/package.json"
              version_url="${base}/package.json.version"

              curl --fail --location --silent --show-error --compressed \
                --referer "${manifest_url}" \
                --output "${root}/package.json" \
                "${manifest_url}"
              curl --fail --location --silent --show-error --compressed \
                --referer "${version_url}" \
                --output "${root}/package.json.version" \
                "${version_url}"

              printf "%s\n" "${RUN_ID}" > /analysis/latest-package-manifest-run-id
              sha256sum "${root}/package.json" > "${root}/package.json.sha256"

              echo "===== VERSION ====="
              cat "${root}/package.json.version"
              echo
              echo "===== MANIFEST SIZE AND SHA256 ====="
              wc -c "${root}/package.json"
              cat "${root}/package.json.sha256"
              echo
              echo "===== ROOT TYPE AND KEYS ====="
              jq -r "type, (if type == \"object\" then keys[] else empty end)" "${root}/package.json"
              echo
              echo "===== STRUCTURE SUMMARY ====="
              jq -c "paths(scalars) as \$p | {path:\$p,value:getpath(\$p)}" "${root}/package.json" \
                | head -n 300
              echo
              echo "===== URL VALUES ====="
              jq -r ".. | strings | select(test(\"^https?://\"))" "${root}/package.json" | sort -u
              echo
              echo "===== LIKELY FILE RECORDS ====="
              jq -c ".. | objects | select(has(\"path\") or has(\"name\") or has(\"filename\") or has(\"url\") or has(\"hash\") or has(\"sha256\") or has(\"size\"))" \
                "${root}/package.json" | head -n 300
            '
