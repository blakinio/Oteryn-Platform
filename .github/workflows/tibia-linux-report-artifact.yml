name: Tibia Linux verified findings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings:
    name: Print concise verified findings
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Read final static-analysis files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          report="/analysis/client-analysis/${run_id}/report"
          echo "run_id=${run_id}"
          echo '--- decode-verification ---'
          cat "${report}/decode-verification.txt"
          echo '--- counts ---'
          cat "${report}/counts.txt"
          echo '--- elf-header-selected ---'
          grep -E 'Class:|Data:|Type:|Machine:|Entry point|Number of program headers|Number of section headers' "${report}/elf-header.txt"
          echo '--- dependencies ---'
          cat "${report}/dependencies.txt"
          echo '--- security-auth-indicators-first-120 ---'
          head -n 120 "${report}/security-auth-indicators.txt"
          echo '--- urls ---'
          cat "${report}/urls.txt"
          SCRIPT
