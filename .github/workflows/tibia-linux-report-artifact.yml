name: Tibia Linux persisted analysis inventory

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-analysis-inventory
  cancel-in-progress: true

jobs:
  report:
    name: Inventory persisted route reports
    runs-on: oteryn-staging
    timeout-minutes: 7
    steps:
      - name: List reports and search route evidence
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              set -eu
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              root=/analysis/client-analysis/${run_id}/report
              echo "===== REPORT DIRECTORIES ====="
              find "$root" -mindepth 1 -maxdepth 2 -type d -print | sort
              echo "===== MATCHING FILES ====="
              grep -RIlE "useProtectedNetworkRoute|ProtectedWorldAddress|UnprotectedWorldAddress|externaladdressprotected|externaladdressunprotected|anticheatprotection|BattlEyeActivationTimestamp|BattlEyeInitiallyActive|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da|0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa" "$root" | sort | head -n 400
              echo "===== ROUTE MATCHES ====="
              grep -RniE "useProtectedNetworkRoute|ProtectedWorldAddress|UnprotectedWorldAddress|externaladdressprotected|externaladdressunprotected|anticheatprotection|BattlEyeActivationTimestamp|BattlEyeInitiallyActive" "$root" | head -n 1000 || true
            '
