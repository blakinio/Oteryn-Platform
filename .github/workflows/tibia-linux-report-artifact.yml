name: Tibia Linux QLibrary callers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-qlibrary-callers
  cancel-in-progress: true

jobs:
  callers:
    name: Find QLibrary method callers and BEClient xrefs
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Persist QLibrary caller report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils grep >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          o="/analysis/client-analysis/${r}/report/qlibrary-callers.txt"
          d=/tmp/client.disasm
          objdump -d -M intel --no-show-raw-insn "$c" > "$d"
          {
            echo '===== QLIBRARY CALLS ====='
            grep -E 'call[[:space:]].*<(_ZN8QLibrary11setFileNameERK7QString|_ZN8QLibrary4loadEv|_ZN8QLibrary7resolveEPKc|_ZNK8QLibrary8isLoadedEv|_ZN8QLibrary6unloadEv)@plt>' "$d" || true
            echo '===== BECLIENT DIRECT XREFS ====='
            grep -E '#[[:space:]]*1d67997([^0-9a-f]|$)' "$d" || true
            echo '===== BATTLEYE DIRECT XREFS ====='
            grep -E '#[[:space:]]*(1c689bb|1d78fc0)([^0-9a-f]|$)' "$d" || true
            echo '===== COUNTS ====='
            printf 'qlibrary_calls='
            grep -Ec 'call[[:space:]].*<(_ZN8QLibrary11setFileNameERK7QString|_ZN8QLibrary4loadEv|_ZN8QLibrary7resolveEPKc|_ZNK8QLibrary8isLoadedEv|_ZN8QLibrary6unloadEv)@plt>' "$d" || true
            printf 'beclient_xrefs='
            grep -Ec '#[[:space:]]*1d67997([^0-9a-f]|$)' "$d" || true
          } > "$o"
          chmod a+r "$o"
          SCRIPT

      - name: Print QLibrary caller report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c 'r=$(cat /analysis/latest-client-analysis-run-id); cat "/analysis/client-analysis/$r/report/qlibrary-callers.txt"'
