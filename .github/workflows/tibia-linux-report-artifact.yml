name: Tibia Linux dual connection manager findings

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-dual-connection-findings
  cancel-in-progress: true

jobs:
  report:
    name: Print dual connection manager findings
    runs-on: oteryn-staging
    timeout-minutes: 7
    steps:
      - name: Print focused persisted reports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              set -eu
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              root=/analysis/client-analysis/${run_id}/report

              echo "===== DUAL CONNECTION MANAGER FILES ====="
              find "$root/dual-connection-manager" -maxdepth 2 -type f -print | sort
              for f in "$root/dual-connection-manager/vtable-map.txt" \
                       "$root/dual-connection-manager/code-xrefs.txt" \
                       "$root/dual-connection-manager/session-network-construction-window.txt"; do
                test -f "$f" || continue
                echo "===== $f ====="
                sed -n "1,1200p" "$f"
              done

              echo "===== GAMESERVER DUAL CLASS FILES ====="
              find "$root/gameserver-dual-connection-class" -maxdepth 2 -type f -print | sort
              for f in "$root/gameserver-dual-connection-class"/*.txt; do
                test -f "$f" || continue
                echo "===== $f ====="
                sed -n "1,1200p" "$f"
              done

              echo "===== ACTUAL DUAL METAOBJECT ====="
              find "$root/actual-dual-metaobject" -maxdepth 2 -type f -print | sort
              for f in "$root/actual-dual-metaobject"/*.txt; do
                test -f "$f" || continue
                echo "===== $f ====="
                sed -n "1,1200p" "$f"
              done

              echo "===== FOCUSED TCP METACALL ====="
              find "$root/focused-tcp-metacall" -maxdepth 2 -type f -print | sort
              for f in "$root/focused-tcp-metacall"/*.txt; do
                test -f "$f" || continue
                echo "===== $f ====="
                sed -n "1,1200p" "$f"
              done

              echo "===== PROTECTED ROUTE SELECTION ====="
              for f in "$root/protected-route-selection/route-selection-index.txt" \
                       "$root/protected-route-selection/session-meta-builder.txt" \
                       "$root/protected-route-selection/session-meta-referenced-data.txt"; do
                test -f "$f" || continue
                echo "===== $f ====="
                sed -n "1,1600p" "$f"
              done
            '
