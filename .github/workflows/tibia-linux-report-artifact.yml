name: Tibia Linux gameserver route accessors

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-gameserver-route-accessors
  cancel-in-progress: true

jobs:
  trace:
    name: Identify functions accessing both world routes
    runs-on: oteryn-staging
    timeout-minutes: 12

    steps:
      - name: Generate route-accessor report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null

          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/gameserver-route-accessors"
          rm -rf "${out}" && mkdir -p "${out}/functions" "${out}/callers"
          full=/tmp/client.disasm

          python3 - "${client}" "${out}" <<'PY'
          import pathlib, struct, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          binary, out_dir = sys.argv[1:]
          targets = [
              ('route_pair_7222', 0x7222a1),
              ('route_pair_7226', 0x722678),
              ('route_pair_7227', 0x722781),
              ('route_pair_722b', 0x722b68),
              ('packed_ports_9ce1', 0x9ce1f3),
              ('meta_type_virtual_704220', 0x704220),
              ('meta_type_virtual_703af0', 0x703af0),
              ('meta_type_virtual_746900', 0x746900),
          ]

          with open(binary, 'rb') as f:
              blob = f.read(); f.seek(0); elf = ELFFile(f); sections = list(elf.iter_sections())
              fdes = []
              try:
                  dwarf = elf.get_dwarf_info()
                  for entry in dwarf.EH_CFI_entries():
                      if isinstance(entry, FDE):
                          start = int(entry['initial_location'])
                          fdes.append((start, start + int(entry['address_range'])))
              except Exception:
                  pass

              def function_range(address):
                  candidates = [(s, e) for s, e in fdes if s <= address < e]
                  return min(candidates, key=lambda x: x[1]-x[0]) if candidates else (address, address+0x5000)

              def va_to_offset(va):
                  for sec in sections:
                      start=int(sec['sh_addr']); size=int(sec['sh_size'])
                      if start <= va < start+size:
                          return int(sec['sh_offset'])+va-start, sec.name
                  return None, None

              resolved = {}
              for sec in sections:
                  if sec['sh_type'] != 'SHT_RELA': continue
                  linked = elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      slot=int(rel['r_offset']); typ=int(rel['r_info_type']); add=int(rel['r_addend']) if rel.is_RELA() else 0
                      value=None
                      if typ==8: value=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sym=linked.get_symbol(int(rel['r_info_sym'])); sv=int(sym['st_value'])
                          if sv: value=sv+add
                      if value is not None: resolved[slot]=value

              def raw_qword(va):
                  off,_=va_to_offset(va)
                  if off is None or off+8>len(blob): return None
                  return struct.unpack_from('<Q',blob,off)[0]
              def qword(va): return resolved.get(va,raw_qword(va))
              def section_of(va): return va_to_offset(va)[1]

              rows=[]
              for name,address in targets:
                  start,end=function_range(address)
                  rows.append((name,address,start,end))
              pathlib.Path(out_dir,'ranges.tsv').write_text(''.join(f'{n}\t{a:x}\t{s:x}\t{e:x}\n' for n,a,s,e in rows))

              # Find vtable slots pointing at these function starts or interior targets.
              report=[]
              for name,address,start,end in rows:
                  report.append(f'===== {name} target=0x{address:x} function=0x{start:x}-0x{end:x} =====')
                  for slot,value in sorted(resolved.items()):
                      if value == start or value == address:
                          report.append(f'relocation_slot=0x{slot:x} slot_section={section_of(slot)} value=0x{value:x}')
                          for delta in range(-24,33,8):
                              va=slot+delta; q=qword(va)
                              report.append(f'  slot{delta:+#x}=0x{va:x} value={None if q is None else hex(q)} target_section={None if q is None else section_of(q)}')
                  report.append('')
              pathlib.Path(out_dir,'vtable-xrefs.txt').write_text('\n'.join(report)+'\n')
          PY

          while IFS="$(printf '\t')" read -r name address start end; do
            [ -n "${address}" ] || continue
            max_end=$((0x${start}+0x12000)); actual_end=$((0x${end}))
            if [ "${actual_end}" -gt "${max_end}" ]; then actual_end="${max_end}"; fi
            stop_hex="$(printf '0x%x' "${actual_end}")"
            objdump -d -M intel --no-show-raw-insn --start-address="0x${start}" --stop-address="${stop_hex}" "${client}" > "${out}/functions/${name}.txt"
          done < "${out}/ranges.tsv"

          objdump -d -M intel --no-show-raw-insn "${client}" > "${full}"

          while IFS="$(printf '\t')" read -r name address start end; do
            [ -n "${start}" ] || continue
            echo "===== CALLERS OF ${name} 0x${start} =====" > "${out}/callers/${name}.txt"
            grep -B 45 -A 75 -E "call[[:space:]]+${start}([[:space:]]|<)" "${full}" >> "${out}/callers/${name}.txt" || true
            echo "===== DIRECT CODE/DATA REFERENCES TO START =====" >> "${out}/callers/${name}.txt"
            grep -B 30 -A 50 -E "#[[:space:]]*${start}([^0-9a-f]|$)" "${full}" >> "${out}/callers/${name}.txt" || true
          done < "${out}/ranges.tsv"

          {
            echo '===== RANGES ====='; cat "${out}/ranges.tsv"
            for f in "${out}"/functions/*.txt; do
              echo "===== $(basename "$f") ROUTE/PORT/BRANCH LINES ====="
              grep -n -B 12 -A 24 -E '(0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da|QUrl|QHostAddress|connect|cmp|test|cmov|sete|setne)' "$f" | head -n 4000 || true
            done
          } > "${out}/focus.txt"

          python3 - "${client}" "${out}"/functions/*.txt > "${out}/referenced-data.txt" <<'PY'
          import re,sys
          from elftools.elf.elffile import ELFFile
          binary,*inputs=sys.argv[1:]; addrs=set()
          for p in inputs:
              text=open(p,encoding='utf-8',errors='replace').read()
              addrs.update(int(x,16) for x in re.findall(r'#\s*([0-9a-fA-F]+)',text))
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
          def v2o(v):
              for s in secs:
                  a=int(s['sh_addr']); z=int(s['sh_size'])
                  if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
              return None,None
          for v in sorted(addrs):
              o,s=v2o(v)
              if o is None: continue
              e=blob.find(b'\0',o,min(len(blob),o+700)); val=None
              if e>o:
                  raw=blob[o:e]
                  if raw and sum(32<=b<127 or b in (9,10,13) for b in raw)/len(raw)>.9:
                      val=raw.decode('utf-8',errors='replace')
              print(f'va=0x{v:x} section={s} string={val!r}')
          PY

          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy route-accessor report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-gameserver-route-accessors"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/gameserver-route-accessors/." "${out}/"

      - name: Upload route-accessor report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-gameserver-route-accessors
          path: ${{ runner.temp }}/tibia-gameserver-route-accessors
          retention-days: 1
