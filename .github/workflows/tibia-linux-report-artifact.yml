name: Tibia Linux focused anti-cheat xrefs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Print focused route and loader summary
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Filter persisted xref report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c '
              r=$(cat /analysis/latest-client-analysis-run-id)
              f="/analysis/client-analysis/$r/report/compact-xrefs.txt"
              echo "===== ROUTE AND SERVER-FIELD XREFS ====="
              sed -n "/===== DIRECT XREF INSTRUCTIONS =====/,/===== LOADER CALL INSTRUCTIONS =====/p" "$f" \
                | grep -Ev "1d78fc0|^=====" || true
              echo "===== LOADER CALLS ====="
              sed -n "/===== LOADER CALL INSTRUCTIONS =====/,/===== COUNTS =====/p" "$f" \
                | grep -v "^=====" || true
              echo "===== FOCUSED COUNTS ====="
              printf "route_server_xrefs="
              sed -n "/===== DIRECT XREF INSTRUCTIONS =====/,/===== LOADER CALL INSTRUCTIONS =====/p" "$f" \
                | grep -Ev "1d78fc0|^=====" | grep -c . || true
              sed -n "/===== COUNTS =====/,$p" "$f"
            '
