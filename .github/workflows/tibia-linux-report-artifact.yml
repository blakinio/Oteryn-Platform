name: Tibia Linux world-address consumers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export protected and unprotected address consumers
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Generate focused address-consumer disassembly
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          o="/analysis/client-analysis/${r}/report/world-address-consumers"
          rm -rf "$o" && mkdir -p "$o"

          objdump -d -M intel --no-show-raw-insn \
            --start-address=0x6f11d0 --stop-address=0x6f1490 \
            "$c" > "$o/consumer-6f12.txt"
          objdump -d -M intel --no-show-raw-insn \
            --start-address=0xe1b3e0 --stop-address=0xe1b780 \
            "$c" > "$o/consumer-e1b5.txt"
          chmod -R a+rX "$o"
          SCRIPT

      - name: Copy address-consumer slices
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-world-address-consumers"
          rm -rf "$out" && mkdir -p "$out"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/world-address-consumers/." "$out/"

      - name: Upload address-consumer slices
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-world-address-consumers
          path: ${{ runner.temp }}/tibia-world-address-consumers
          retention-days: 1
