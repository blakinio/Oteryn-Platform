name: Tibia Linux persisted connection route-slot export

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-persisted-connection-route-slot
  cancel-in-progress: true

jobs:
  export:
    name: Export persisted connection-controller route report
    runs-on: oteryn-staging
    timeout-minutes: 7
    steps:
      - name: Inspect persisted report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c '
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              report=/analysis/client-analysis/${run_id}/report/connection-controller-route-slot
              test -d "${report}"
              find "${report}" -maxdepth 2 -type f -printf "%p %s bytes\n" | sort
            '

      - name: Copy persisted report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-connection-controller-route-slot"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/connection-controller-route-slot/." "${out}/"

      - name: Upload persisted report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-connection-controller-route-slot
          path: ${{ runner.temp }}/tibia-connection-controller-route-slot
          retention-days: 1
