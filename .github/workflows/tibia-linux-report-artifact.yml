name: Tibia Linux auth-controller metacall export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export persisted auth-controller report
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Inspect persisted report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c '
              r=$(cat /analysis/latest-client-analysis-run-id)
              p="/analysis/client-analysis/$r/report/auth-controller-metacalls"
              test -d "$p"
              find "$p" -maxdepth 2 -type f -printf "%P\t%s bytes\n" | sort
            '

      - name: Copy persisted report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-auth-controller-metacalls"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/auth-controller-metacalls/." "${out}/"

      - name: Upload persisted report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-auth-controller-metacalls
          path: ${{ runner.temp }}/tibia-auth-controller-metacalls
          retention-days: 1
