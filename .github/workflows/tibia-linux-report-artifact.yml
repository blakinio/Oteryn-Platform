name: Tibia Linux login handler and protobuf fields

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-login-handler-fields
  cancel-in-progress: true

jobs:
  decode:
    name: Decode login handler signals and message fields
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Decode Qt metaobject and descriptor regions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id=$(cat /analysis/latest-client-analysis-run-id)
          client=/analysis/client-analysis/${run_id}/download/client
          out=/analysis/client-analysis/${run_id}/report/login-handler-fields-final
          rm -rf "$out" && mkdir -p "$out"

          python3 - "$client" "$out" <<'PY'
          import pathlib, struct, sys
          from elftools.elf.elffile import ELFFile

          binary,out_dir=sys.argv[1:]
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); sections=list(elf.iter_sections())
              resolved={}
              for sec in sections:
                  if sec['sh_type']!='SHT_RELA': continue
                  linked=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      slot=int(rel['r_offset']); typ=int(rel['r_info_type']); add=int(rel['r_addend']) if rel.is_RELA() else 0
                      val=None
                      if typ==8: val=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sym=linked.get_symbol(int(rel['r_info_sym'])); base=int(sym['st_value'])
                          if base: val=base+add
                      if val is not None: resolved[slot]=val

          def locate(va):
              for sec in sections:
                  a=int(sec['sh_addr']); n=int(sec['sh_size'])
                  if a<=va<a+n:return int(sec['sh_offset'])+va-a,sec.name
              return None,None
          def u32(va):
              off,_=locate(va); return None if off is None else struct.unpack_from('<I',blob,off)[0]
          def qword(va):
              if va in resolved:return resolved[va]
              off,_=locate(va); return None if off is None else struct.unpack_from('<Q',blob,off)[0]
          def decode_stringdata(base):
              first=u32(base)
              if not first or first%8:return []
              count=first//8
              if count<1 or count>2000:return []
              out=[]
              for i in range(count):
                  rel=u32(base+i*8); size=u32(base+i*8+4)
                  if rel is None or size is None or size>10000:return []
                  off,_=locate(base+rel)
                  if off is None:return []
                  out.append(blob[off:off+size].decode('utf-8','replace'))
              return out

          static=0x3082fa0
          stringdata=qword(static+8); metadata=qword(static+16); metacall=qword(static+24)
          strings=decode_stringdata(stringdata)
          rows=[f'static=0x{static:x}',f'stringdata=0x{stringdata:x}',f'metadata=0x{metadata:x}',f'metacall=0x{metacall:x}',f'string_count={len(strings)}']
          for i,s in enumerate(strings):rows.append(f'string[{i}]={s!r}')
          if metadata:
              hdr=[u32(metadata+i*4) for i in range(14)]
              rows.append('metadata_header='+' '.join(hex(x or 0) for x in hdr))
              method_count=hdr[4] or 0; method_data=hdr[5] or 0; signal_count=hdr[13] or 0
              rows.append(f'method_count={method_count} method_data={method_data} signal_count={signal_count}')
              for i in range(method_count):
                  entry=[u32(metadata+(method_data+i*6+j)*4) for j in range(6)]
                  ni=entry[0] if entry else None
                  name=strings[ni] if ni is not None and ni<len(strings) else None
                  rows.append(f'method[{i}] name_index={ni} name={name!r} entry={entry}')
          pathlib.Path(out_dir,'handler-metaobject.txt').write_text('\n'.join(rows)+'\n')

          # Dump printable strings and hex around known embedded descriptor field-name offsets.
          regions=[('login-fields',0x2887200,0x900),('login-fields-wide',0x2887000,0x1800),('character-fields',0x28a5000,0x1000),('protobuf-names',0x1cbef00,0x2600)]
          for name,off,size in regions:
              data=blob[off:off+size]
              pathlib.Path(out_dir,f'{name}.hex.txt').write_text(''.join(f'{off+i:08x}  '+data[i:i+16].hex(' ')+'\n' for i in range(0,len(data),16)))
              found=[]; start=0
              for i,b in enumerate(data+b'\0'):
                  if 32<=b<127:
                      continue
                  if i-start>=2:
                      raw=data[start:i]
                      try:found.append(f'0x{off+start:x}\t{raw.decode("ascii")}')
                      except:pass
                  start=i+1
              pathlib.Path(out_dir,f'{name}.strings.txt').write_text('\n'.join(found)+'\n')
          PY

          {
            echo '===== HANDLER METAOBJECT ====='; cat "$out/handler-metaobject.txt"
            for f in "$out"/*.strings.txt; do echo "===== $(basename "$f") ====="; cat "$f"; done
          } > "$out/concise.txt"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print decoded fields
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 sh -lc '
            run_id=$(cat /analysis/latest-client-analysis-run-id)
            cat /analysis/client-analysis/${run_id}/report/login-handler-fields-final/concise.txt
          '

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-login-handler-fields"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/login-handler-fields-final/." "$out/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-login-handler-fields
          path: ${{ runner.temp }}/tibia-login-handler-fields
          retention-days: 1
