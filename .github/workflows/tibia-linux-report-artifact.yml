name: Tibia Linux GameserverDualConnection class trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-gameserver-dual-connection
  cancel-in-progress: true

jobs:
  trace:
    name: Decode real dual-connection vtable and methods
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Generate class report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/gameserver-dual-connection-class"
          rm -rf "${out}" && mkdir -p "${out}/functions"

          python3 - "${client}" "${out}" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          binary,out=sys.argv[1:]
          VPTR=0x30b5b88
          STATIC=0x30b5b40
          extras=[0xb53d60,0xb491d0,0xb49480,0xb48630]
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              def v2o(v):
                  for s in secs:
                      a=int(s['sh_addr']); z=int(s['sh_size'])
                      if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
                  return None,None
              def rawq(v):
                  o,_=v2o(v);return None if o is None or o+8>len(blob) else struct.unpack_from('<Q',blob,o)[0]
              def u32(v):
                  o,_=v2o(v);return None if o is None or o+4>len(blob) else struct.unpack_from('<I',blob,o)[0]
              resolved={}; relocs=[]
              for s in secs:
                  if s['sh_type']!='SHT_RELA':continue
                  linked=elf.get_section(s['sh_link']) if s['sh_link'] else None
                  for rel in s.iter_relocations():
                      slot=int(rel['r_offset']);typ=int(rel['r_info_type']);add=int(rel['r_addend']) if rel.is_RELA() else 0;val=None;sname=''
                      if typ==8:val=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sy=linked.get_symbol(int(rel['r_info_sym']));sv=int(sy['st_value']);sname=sy.name
                          if sv:val=sv+add
                      if val is not None:resolved[slot]=val;relocs.append((slot,val,typ,sname))
              def q(v):return resolved.get(v,rawq(v))
              def cstr(v,limit=1000):
                  o,sec=v2o(v)
                  if o is None:return None,sec
                  e=blob.find(b'\0',o,min(len(blob),o+limit))
                  if e<=o:return None,sec
                  try:return blob[o:e].decode('utf-8'),sec
                  except:return None,sec
              fdes=[]
              try:
                  for e in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(e,FDE):
                          s=int(e['initial_location']);fdes.append((s,s+int(e['address_range'])))
              except Exception:pass
              def frange(a):
                  m=[x for x in fdes if x[0]<=a<x[1]]
                  return min(m,key=lambda x:x[1]-x[0]) if m else (a,a+0x10000)

              lines=[];rows=[];seen=set()
              lines.append(f'VPTR=0x{VPTR:x} STATIC=0x{STATIC:x}')
              ti=q(VPTR-8);lines.append(f'offset_to_top={q(VPTR-16)!r} typeinfo={None if ti is None else hex(ti)} section={None if ti is None else v2o(ti)[1]}')
              if ti:
                  np=q(ti+8);name,sec=cstr(np) if np else (None,None);lines.append(f'typeinfo_name={name!r} ptr={None if np is None else hex(np)} section={sec}')
              for i in range(0,48):
                  a=VPTR+i*8;t=q(a);sec=None if t is None else v2o(t)[1]
                  lines.append(f'slot={i} offset=0x{i*8:x} va=0x{a:x} target={None if t is None else hex(t)} section={sec}')
                  if t and sec=='.text' and t not in seen:
                      s,e=frange(t);rows.append((f'vslot{i}',t,s,e));seen.add(t)
              lines.append('STATIC_NEIGHBORHOOD')
              for d in range(-0x30,0x80,8):
                  a=STATIC+d;t=q(a);lines.append(f'0x{a:x}: {None if t is None else hex(t)} section={None if t is None else v2o(t)[1]}')
              for a in extras:
                  s,e=frange(a);rows.append((f'extra_{a:x}',a,s,e))
              pathlib.Path(out,'class-map.txt').write_text('\n'.join(lines)+'\n')
              pathlib.Path(out,'ranges.tsv').write_text(''.join(f'{n}\t{a:x}\t{s:x}\t{e:x}\n' for n,a,s,e in rows))
              # all relocations to static object, vptr, or any vtable target
              wanted={VPTR,STATIC}|{q(VPTR+i*8) for i in range(48)}
              pathlib.Path(out,'relocation-xrefs.txt').write_text(''.join(f'slot=0x{s:x} value=0x{v:x} type={t} sym={n}\n' for s,v,t,n in relocs if v in wanted))
          PY

          while IFS="$(printf '\t')" read -r name address start end; do
            actual_end=$((0x${end}));max_end=$((0x${start}+0x24000));[ "${actual_end}" -le "${max_end}" ] || actual_end="${max_end}"
            objdump -d -M intel --no-show-raw-insn --start-address="0x${start}" --stop-address="$(printf '0x%x' "${actual_end}")" "${client}" > "${out}/functions/${name}-0x${address}.txt"
          done < "${out}/ranges.tsv"

          objdump -d -M intel --no-show-raw-insn "${client}" | grep -n -B 40 -A 90 -E '(30b5b88|30b5b40|b491d0|b49480|b48630)' > "${out}/code-xrefs.txt" || true
          grep -RniE 'QTcpSocket|QAbstractSocket|QHostAddress|QUrl|connectToHost|disconnectFromHost|QIODevice|write|read|0x10\]|0x18\]|0x20\]|0x28\]|0x40\]|0x48\]|0x70\]|0x88\]|0x90\]|0x98\]|0x9c\]|0xa0\]|cmp|test|cmov|sete|setne|call[[:space:]]' "${out}/functions" > "${out}/focused-index.txt" || true
          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy class report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-gameserver-dual-connection-class"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/gameserver-dual-connection-class/." "${out}/"

      - name: Upload class report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-gameserver-dual-connection-class
          path: ${{ runner.temp }}/tibia-gameserver-dual-connection-class
          retention-days: 1
