name: Tibia Linux route-state consumers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-route-state-consumers
  cancel-in-progress: true

jobs:
  trace:
    name: Trace protected and unprotected route-state consumers
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Generate route-state xref report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils grep >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          o="/analysis/client-analysis/${r}/report/route-state-xrefs.txt"
          d=/tmp/client.disasm

          # Global QString/key objects initialized from the login-response field names.
          # address -> logical field
          cat > /tmp/targets.tsv <<'EOF'
          3195d80 externalportprotected
          3195d60 externalportunprotected
          3195dc0 externaladdressprotected
          3195da0 externaladdressunprotected
          3195d00 anticheatprotection
          31e87c0 useProtectedNetworkRoute
          318d3d0 ProtectedWorldAddress
          318d3f0 UnprotectedWorldAddress
          EOF

          objdump -d -M intel --no-show-raw-insn "$c" > "$d"
          {
            echo '===== TARGETS ====='
            cat /tmp/targets.tsv
            echo '===== DIRECT REFERENCES BY TARGET ====='
            while read -r addr name; do
              echo "--- ${name} @ 0x${addr} ---"
              grep -E "#[[:space:]]*${addr}([^0-9a-f]|$)" "$d" || true
            done < /tmp/targets.tsv
            echo '===== COUNTS ====='
            while read -r addr name; do
              count="$(grep -Ec "#[[:space:]]*${addr}([^0-9a-f]|$)" "$d" || true)"
              echo "${name}=${count}"
            done < /tmp/targets.tsv
          } > "$o"
          chmod a+r "$o"
          SCRIPT

      - name: Print route-state xrefs
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c 'r=$(cat /analysis/latest-client-analysis-run-id); cat "/analysis/client-analysis/$r/report/route-state-xrefs.txt"'
