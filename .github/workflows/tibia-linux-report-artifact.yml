name: Tibia Linux exact Qt decode export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export persisted exact Qt decode
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Inspect persisted exact decode
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c '
              r=$(cat /analysis/latest-client-analysis-run-id)
              p="/analysis/client-analysis/$r/report/exact-qt-metaobjects"
              test -d "$p"
              find "$p" -maxdepth 2 -type f -printf "%P\t%s bytes\n" | sort
            '

      - name: Copy persisted exact decode
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-exact-qt-metaobjects"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/exact-qt-metaobjects/." "${out}/"

      - name: Upload persisted exact decode
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-exact-qt-metaobjects
          path: ${{ runner.temp }}/tibia-exact-qt-metaobjects
          retention-days: 1
