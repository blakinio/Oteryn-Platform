name: Tibia Linux GameserverDualConnection Qt metaobject
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tibia-linux-dual-metaobject
  cancel-in-progress: true
jobs:
  trace:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Decode metaobject
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id=$(cat /analysis/latest-client-analysis-run-id)
          client=/analysis/client-analysis/${run_id}/download/client
          out=/analysis/client-analysis/${run_id}/report/dual-metaobject
          rm -rf "$out" && mkdir -p "$out/functions"
          python3 - "$client" "$out" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          binary,out=sys.argv[1:]
          SD=0x1d4ad1c; MD=0x1d4abe0; MC=0xdcb580
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              def v2o(v):
                  for s in secs:
                      a=int(s['sh_addr']);z=int(s['sh_size'])
                      if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
                  return None,None
              def u32(v):
                  o,_=v2o(v); return None if o is None else struct.unpack_from('<I',blob,o)[0]
              first=u32(SD); count=first//8
              strings=[]
              for i in range(count):
                  rel=u32(SD+i*8); ln=u32(SD+i*8+4); o,_=v2o(SD+rel)
                  strings.append(blob[o:o+ln].decode('utf-8','replace'))
              h=[u32(MD+i*4) for i in range(14)]
              method_count,method_data,signal_count=h[4],h[5],h[13]
              lines=[f'SD=0x{SD:x} MD=0x{MD:x} MC=0x{MC:x}',f'string_count={count}',f'header={h}',f'method_count={method_count} method_data={method_data} signal_count={signal_count}']
              for i,s in enumerate(strings): lines.append(f'string[{i}]={s!r}')
              lines.append('METHODS')
              for i in range(method_count):
                  e=[u32(MD+(method_data+i*6+j)*4) for j in range(6)]
                  ni=e[0]; name=strings[ni] if ni<len(strings) else None
                  lines.append(f'method[{i}] name={name!r} entry={e} kind={"signal" if i<signal_count else "slot/method"}')
              pathlib.Path(out,'decoded.txt').write_text('\n'.join(lines)+'\n')
              fdes=[]
              try:
                  for x in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(x,FDE):
                          a=int(x['initial_location']);fdes.append((a,a+int(x['address_range'])))
              except: pass
              m=[x for x in fdes if x[0]<=MC<x[1]]
              s,e=min(m,key=lambda x:x[1]-x[0]) if m else (MC,MC+0x6000)
              pathlib.Path(out,'metacall-range.txt').write_text(f'{s:x}\t{e:x}\n')
          PY
          read start end < <(tr '\t' ' ' < "$out/metacall-range.txt")
          objdump -d -M intel --no-show-raw-insn --start-address=0x${start} --stop-address=0x${end} "$client" > "$out/metacall.txt"
          for a in b55110 b3d5a0 b3d640 b552a0 b55690 b482b0 b3eca0 b47f90 b48520 b48630 b487a0 b488f0 b48a20 b491d0 b49480 b3f8b0 b3fa30 b55da0 b55ea0; do
            objdump -d -M intel --no-show-raw-insn --start-address=0x$a --stop-address=$((0x$a+0x5000)) "$client" > "$out/functions/0x$a.txt"
          done
          chmod -R a+rX "$out"
          SCRIPT
      - name: Copy
        shell: bash
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/tibia-dual-metaobject; rm -rf "$out"; mkdir -p "$out"
          run_id=$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)
          cid=$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/dual-metaobject/." "$out/"
      - uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-dual-metaobject
          path: ${{ runner.temp }}/tibia-dual-metaobject
          retention-days: 1
