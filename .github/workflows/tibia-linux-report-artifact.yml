name: Tibia Linux persisted slot12 function

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-connection-controller-slot12
  cancel-in-progress: true

jobs:
  report:
    name: Print persisted slot12 function
    runs-on: oteryn-staging
    timeout-minutes: 7
    steps:
      - name: Print exact function and focused lines
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              set -eu
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              report=/analysis/client-analysis/${run_id}/report/connection-controller-route-slot
              func=$report/functions/ConnectionController-slot12-0xc49630.txt
              test -f "$func"
              echo "===== STATS ====="
              wc -l -c "$func"
              echo "===== FUNCTION ====="
              cat "$func"
              echo "===== FOCUSED ====="
              grep -n -B 15 -A 40 -E "(call[[:space:]]|cmp|test|cmov|sete|setne|QHostAddress|QTcpSocket|connect|BattlEye|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da|0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa)" "$func" || true
            '
