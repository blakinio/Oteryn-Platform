name: Tibia Linux authentication helper flow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-auth-helper-flow
  cancel-in-progress: true

jobs:
  trace:
    name: Trace authentication JSON helper and world parser calls
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Generate helper flow report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null

          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          out="/analysis/client-analysis/${r}/report/auth-helper-flow"
          rm -rf "$out" && mkdir -p "$out"
          d=/tmp/client.disasm
          objdump -d -M intel --no-show-raw-insn "$c" > "$d"

          objdump -d -M intel --no-show-raw-insn \
            --start-address=0xe1a810 --stop-address=0xe1afdc "$c" \
            > "$out/helper-e1a810.txt"

          {
            echo '===== DIRECT CALLERS OF e1a810 ====='
            grep -E 'call[[:space:]]+e1a810([[:space:]]|<)' "$d" || true
            echo '===== DIRECT CALLERS OF WORLD PARSER e0fcf0 ====='
            grep -E 'call[[:space:]]+e0fcf0([[:space:]]|<)' "$d" || true
            echo '===== INDIRECT CALLS INSIDE HELPER ====='
            grep -E 'call[[:space:]]+.*\*|call[[:space:]]+(QWORD|DWORD) PTR' "$out/helper-e1a810.txt" || true
            echo '===== FIELD-SIZED MEMORY OPERATIONS INSIDE HELPER ====='
            grep -E '(0x80|0x78|0x74|0x70|0x54|0x50|0x48|0x38|0x30|0x20)' "$out/helper-e1a810.txt" || true
          } > "$out/helper-index.txt"

          python3 - "$c" "$out/helper-e1a810.txt" > "$out/helper-referenced-data.txt" <<'PY'
          import re, sys
          from elftools.elf.elffile import ELFFile

          binary, disasm = sys.argv[1:]
          text = open(disasm, encoding='utf-8', errors='replace').read()
          addresses = sorted({int(x, 16) for x in re.findall(r'#\s*([0-9a-fA-F]+)', text)})
          with open(binary, 'rb') as f:
              blob = f.read()
              f.seek(0)
              elf = ELFFile(f)
              sections = list(elf.iter_sections())

          def va_to_offset(va):
              for sec in sections:
                  start = int(sec['sh_addr'])
                  size = int(sec['sh_size'])
                  if start <= va < start + size:
                      return int(sec['sh_offset']) + va - start, sec.name
              return None, None

          for va in addresses:
              off, sec = va_to_offset(va)
              if off is None:
                  continue
              end = blob.find(b'\0', off, min(len(blob), off + 260))
              value = None
              if end > off:
                  raw = blob[off:end]
                  if raw and sum(32 <= b < 127 or b in (9,10,13) for b in raw) / len(raw) > 0.88:
                      value = raw.decode('utf-8', errors='replace')
              print(f'va=0x{va:x} section={sec} string={value!r}')
          PY

          grep -B 50 -A 90 -E 'call[[:space:]]+e1a810([[:space:]]|<)' "$d" \
            | head -n 2500 > "$out/helper-caller-contexts.txt" || true

          chmod -R a+rX "$out"
          SCRIPT

      - name: Copy helper flow report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-auth-helper-flow"
          rm -rf "$out" && mkdir -p "$out"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/auth-helper-flow/." "$out/"

      - name: Upload helper flow report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-auth-helper-flow
          path: ${{ runner.temp }}/tibia-auth-helper-flow
          retention-days: 1
