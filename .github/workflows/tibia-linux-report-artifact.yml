name: Tibia Linux persisted report export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export latest persisted text report
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Copy entire latest report directory
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-linux-report"
          rm -rf "${out}"
          mkdir -p "${out}"

          run_id="$(docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 cat /analysis/latest-client-analysis-run-id)"

          docker run --rm \
            --env "RUN_ID=${run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c \
            'tar -C "/analysis/client-analysis/${RUN_ID}/report" -cf - .' \
            | tar -C "${out}" -xf -

          {
            echo "analysis_run_id=${run_id}"
            echo "exported_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "binary_included=no"
            echo "source_volume=oteryn-tibia-linux-analysis"
          } > "${out}/artifact-metadata.txt"

          echo '===== EXPORTED FILES ====='
          find "${out}" -maxdepth 2 -type f -printf '%s %p\n' | sort -n
          echo '===== AVAILABLE CONTENT ====='
          for name in exit-code.txt summary.txt counts.txt dependencies.txt security-auth-indicators.txt urls.txt; do
            if test -f "${out}/${name}"; then
              echo "--- ${name} ---"
              cat "${out}/${name}"
            fi
          done

      - name: Upload text-only report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-client-text-report
          path: ${{ runner.temp }}/tibia-linux-report
          if-no-files-found: error
          retention-days: 1
