name: Tibia Linux focused TCP metacall trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-tcp-qt-metaobject
  cancel-in-progress: true

jobs:
  trace:
    name: Trace TCP metacall and socket callbacks
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Generate focused report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/focused-tcp-metacall"
          rm -rf "${out}" && mkdir -p "${out}/functions"

          readelf -Ws "${client}" | c++filt | grep -Ei 'Q(AbstractSocket|TcpSocket|HostAddress|IODevice|Network)|connectToHost|disconnectFromHost|abort\(|write\(|read\(' > "${out}/qt-network-symbols.txt" || true
          objdump -d -M intel --no-show-raw-insn --start-address=0xdd07e0 --stop-address=0xdd1200 "${client}" > "${out}/tcp-static-metacall.txt"
          objdump -s --start-address=0x1d4a800 --stop-address=0x1d4b800 "${client}" > "${out}/tcp-meta-string-region.txt"

          python3 - "${client}" "${out}" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          binary,out=sys.argv[1:]
          targets=[0xdd07e0,0xb45500,0xdc4370,0xb40340,0xb3e300,0xb3dca0,0xb3dd20,
                   0xb403c0,0xb3d580,0xb3d630,0xb3d6c0,0xb55da0,0xb55ea0,0xb3fa30,0xb3d6d0,
                   0x7db630,0x7db640]
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              fdes=[]
              try:
                  for e in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(e,FDE):
                          s=int(e['initial_location']); fdes.append((s,s+int(e['address_range'])))
              except Exception: pass
              rows=[]
              for a in targets:
                  m=[x for x in fdes if x[0]<=a<x[1]]
                  s,e=min(m,key=lambda x:x[1]-x[0]) if m else (a,a+0x6000)
                  rows.append((a,s,e))
              pathlib.Path(out,'ranges.tsv').write_text(''.join(f'{a:x}\t{s:x}\t{e:x}\n' for a,s,e in rows))

              # Find compact Qt string-table candidates that contain the exact known class string.
              def v2o(v):
                  for sec in secs:
                      a=int(sec['sh_addr']); z=int(sec['sh_size'])
                      if a<=v<a+z: return int(sec['sh_offset'])+v-a,sec.name
                  return None,None
              def u32(v):
                  o,_=v2o(v)
                  return None if o is None or o+4>len(blob) else struct.unpack_from('<I',blob,o)[0]
              target=0x1d4b150; target_len=len(b'tibia::network::TGameserverTCPConnection')
              candidates=[]
              for base in range(target-0x10000,target+1,4):
                  first=u32(base)
                  if first is None or first==0 or first%8: continue
                  count=first//8
                  if not 1<=count<=1024: continue
                  hit=False
                  for i in range(count):
                      rel=u32(base+i*8); ln=u32(base+i*8+4)
                      if rel is None or ln is None: break
                      if base+rel==target and ln==target_len: hit=True; break
                  if hit: candidates.append((base,count))
              lines=[]
              for base,count in candidates:
                  lines.append(f'candidate base=0x{base:x} count={count}')
                  for i in range(count):
                      rel=u32(base+i*8); ln=u32(base+i*8+4)
                      if rel is None or ln is None or ln>2000: break
                      o,_=v2o(base+rel)
                      if o is None: break
                      try: text=blob[o:o+ln].decode('utf-8')
                      except UnicodeDecodeError: text='<non-utf8>'
                      lines.append(f'  [{i}] rel=0x{rel:x} len={ln} text={text!r}')
              pathlib.Path(out,'string-table-candidates.txt').write_text('\n'.join(lines)+'\n')

              # Resolve every relocation pointing to a candidate base or the known metacall.
              refs=[]
              wanted={x[0] for x in candidates}|{0xdd07e0}
              for sec in secs:
                  if sec['sh_type']!='SHT_RELA': continue
                  linked=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      add=int(rel['r_addend']) if rel.is_RELA() else 0; typ=int(rel['r_info_type']); val=None; sym=''
                      if typ==8: val=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sy=linked.get_symbol(int(rel['r_info_sym'])); sv=int(sy['st_value']); sym=sy.name
                          if sv: val=sv+add
                      if val in wanted: refs.append((int(rel['r_offset']),val,typ,sym))
              pathlib.Path(out,'candidate-relocations.txt').write_text(''.join(f'slot=0x{s:x} value=0x{v:x} type={t} sym={n}\n' for s,v,t,n in refs))
          PY

          while IFS="$(printf '\t')" read -r address start end; do
            actual_end=$((0x${end})); max_end=$((0x${start}+0x14000)); [ "${actual_end}" -le "${max_end}" ] || actual_end="${max_end}"
            objdump -d -M intel --no-show-raw-insn --start-address="0x${start}" --stop-address="$(printf '0x%x' "${actual_end}")" "${client}" > "${out}/functions/0x${address}.txt"
          done < "${out}/ranges.tsv"
          grep -RniE 'connectToHost|disconnectFromHost|QAbstractSocket|QTcpSocket|QHostAddress|QIODevice|call[[:space:]]|cmp|test|cmov|sete|setne' "${out}/functions" > "${out}/focused-index.txt" || true
          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-focused-tcp-metacall"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/focused-tcp-metacall/." "${out}/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-focused-tcp-metacall
          path: ${{ runner.temp }}/tibia-focused-tcp-metacall
          retention-days: 1
