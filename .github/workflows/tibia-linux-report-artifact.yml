name: Tibia Linux protobuf and BattlEye focus

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-protobuf-battleye-focus
  cancel-in-progress: true

jobs:
  analyze:
    name: Extract focused static evidence
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Analyze descriptors callbacks and callers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.13-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils file >/dev/null
          pip install --no-cache-dir pyelftools capstone protobuf >/dev/null

          run_id=$(cat /analysis/latest-client-analysis-run-id)
          root=/analysis/client-analysis/${run_id}
          client=${root}/download/client
          out=${root}/report/protobuf-battleye-final
          rm -rf "$out"
          mkdir -p "$out/functions" "$out/callers"
          test "$(sha256sum "$client" | awk '{print $1}')" = "8b25d65ece158723dbb50a1b592c1ec8a3247a650fcd2d299bebdfd133cb5752"

          cat > /tmp/analyze.py <<'PY'
          from __future__ import annotations
          import json, re, struct, subprocess
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP
          from google.protobuf import descriptor_pb2
          from google.protobuf.message import DecodeError

          client = Path(__import__('sys').argv[1])
          out = Path(__import__('sys').argv[2])
          data = client.read_bytes()

          with client.open('rb') as fh:
              elf = ELFFile(fh)
              loads = []
              for seg in elf.iter_segments():
                  if seg['p_type'] == 'PT_LOAD':
                      loads.append((int(seg['p_vaddr']), int(seg['p_offset']), int(seg['p_filesz'])))
              text = elf.get_section_by_name('.text')
              text_va = int(text['sh_addr']); text_bytes = text.data()
              fdes = []
              dwarf = elf.get_dwarf_info()
              for entry in dwarf.EH_CFI_entries():
                  if isinstance(entry, FDE):
                      start = int(entry['initial_location'])
                      end = start + int(entry['address_range'])
                      fdes.append((start, end))
              fdes.sort()

          def va_to_off(va: int) -> int:
              for v, o, n in loads:
                  if v <= va < v+n:
                      return o + va-v
              raise ValueError(hex(va))

          def containing_fde(addr: int):
              lo, hi = 0, len(fdes)
              while lo < hi:
                  mid = (lo+hi)//2
                  if fdes[mid][0] <= addr: lo = mid+1
                  else: hi = mid
              if lo:
                  s,e = fdes[lo-1]
                  if s <= addr < e: return s,e
              return None

          def disasm_range(start: int, end: int, path: Path):
              cmd = ['objdump','-d','-M','intel','--start-address',hex(start),'--stop-address',hex(end),str(client)]
              path.write_text(subprocess.run(cmd, check=True, text=True, capture_output=True).stdout)

          # Exact callback and key control-flow functions.
          exact = {
              'BE_callback_1': 0x7418f0,
              'BE_callback_2': 0x741b50,
              'BE_callback_3': 0x741de0,
              'BE_session_dispatch': 0x6f8000,
              'BE_setup_Init': 0x6fadb0,
              'login_handler_metacall': 0xcf1600,
              'dual_packet_received': 0xb487f0,
              'tcp_connect': 0xb403c0,
          }
          idx = []
          for name, addr in exact.items():
              rng = containing_fde(addr) or (addr, addr+0x500)
              idx.append({'name':name,'target':hex(addr),'start':hex(rng[0]),'end':hex(rng[1])})
              disasm_range(*rng, out/'functions'/f'{name}-{addr:x}.txt')
          (out/'function-index.json').write_text(json.dumps(idx, indent=2))

          md = Cs(CS_ARCH_X86, CS_MODE_64); md.detail = True
          targets = {
              0x30c64c0:'GameclientMessageLogin_vptr',
              0x30c4648:'GameclientMessageSecondaryLogin_vptr',
              0x3082fa0:'TLoginProtocolMessageHandler_metaobject',
              0x1cceb44:'GameclientMessageLogin_descriptor_name',
              0x1cd14c0:'GameclientMessageSecondaryLogin_descriptor_name',
              0x1cca6dc:'GameserverMessageLoginChallenge_descriptor_name',
          }
          hits = []
          for ins in md.disasm(text_bytes, text_va):
              resolved = []
              for op in ins.operands:
                  if op.type == X86_OP_IMM:
                      resolved.append(int(op.imm) & ((1<<64)-1))
                  elif op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                      resolved.append(ins.address + ins.size + op.mem.disp)
              for value in resolved:
                  if value in targets:
                      hits.append({'at':ins.address,'target':value,'kind':targets[value], 'instruction':f'{ins.mnemonic} {ins.op_str}'})

          # Direct callers of key generated protobuf methods and Qt activation.
          direct_call_targets = {
              0x1761e10:'login_New', 0x17570c0:'login_Clear', 0x175c000:'login_Parse',
              0x17117d0:'protobuf_Serialize', 0xbd10e0:'login_app_slot18', 0xbd18d0:'login_app_slot19',
              0x1761f30:'secondary_New', 0x17571d0:'secondary_Clear', 0x175c1d0:'secondary_Parse',
              0x1763930:'secondary_app_slot18', 0x17a7470:'secondary_app_slot19',
              0x4ddda0:'QMetaObject_activate',
          }
          for ins in md.disasm(text_bytes, text_va):
              if ins.mnemonic == 'call' and ins.operands and ins.operands[0].type == X86_OP_IMM:
                  dest = int(ins.operands[0].imm) & ((1<<64)-1)
                  if dest in direct_call_targets:
                      hits.append({'at':ins.address,'target':dest,'kind':'call_'+direct_call_targets[dest], 'instruction':f'{ins.mnemonic} {ins.op_str}'})

          # Keep only unique FDEs containing interesting references; disassemble bounded set.
          ranges = {}
          for h in hits:
              rng = containing_fde(h['at'])
              if rng and rng[1]-rng[0] <= 0x12000:
                  ranges.setdefault(rng, []).append(h)
          caller_index = []
          for num, ((s,e), rhits) in enumerate(sorted(ranges.items())[:120]):
              kinds = sorted({h['kind'] for h in rhits})
              caller_index.append({'start':hex(s),'end':hex(e),'size':e-s,'kinds':kinds,'hits':[{**h,'at':hex(h['at']),'target':hex(h['target'])} for h in rhits]})
              disasm_range(s,e,out/'callers'/f'{num:03d}-{s:x}-{e:x}.txt')
          (out/'caller-index.json').write_text(json.dumps(caller_index, indent=2))

          # Raw locations and printable context around relevant protobuf names.
          needles = [b'GameclientMessageLogin', b'GameclientMessageSecondaryLogin', b'GameserverMessageLoginChallenge', b'clientsessionid', b'charactername', b'sessionkey']
          contexts = []
          for needle in needles:
              pos = 0
              while True:
                  pos = data.find(needle, pos)
                  if pos < 0: break
                  before = max(0,pos-768); after=min(len(data),pos+len(needle)+1536)
                  chunk=data[before:after]
                  strings=[m.group().decode('utf-8','replace') for m in re.finditer(rb'[ -~]{3,}',chunk)]
                  contexts.append({'needle':needle.decode(),'file_offset':hex(pos),'strings':strings})
                  pos += 1
          (out/'protobuf-string-contexts.json').write_text(json.dumps(contexts, indent=2, ensure_ascii=False))

          def read_varint(buf, p):
              value=0; shift=0
              for i in range(10):
                  if p+i >= len(buf): raise ValueError
                  b=buf[p+i]; value |= (b&0x7f)<<shift
                  if not b&0x80: return value,p+i+1
                  shift += 7
              raise ValueError

          # Locate and parse serialized FileDescriptorProto blobs ending in syntax=proto2/proto3.
          parsed=[]; seen=set()
          target_names={'GameclientMessageLogin','GameclientMessageSecondaryLogin','GameserverMessageLoginChallenge','GameserverMessageLoginSuccess'}
          starts=[]
          for p,b in enumerate(data):
              if b != 0x0a: continue
              try: n,q=read_varint(data,p+1)
              except ValueError: continue
              if 1 <= n <= 240 and q+n <= len(data):
                  name=data[q:q+n]
                  if name.endswith(b'.proto') and all(32 <= c < 127 for c in name): starts.append(p)
          endings=[]
          for marker in (b'\x62\x06proto3',b'\x62\x06proto2'):
              p=0
              while True:
                  p=data.find(marker,p)
                  if p<0: break
                  endings.append(p+len(marker)); p += 1
          for s in starts:
              for e in endings:
                  if not (s < e <= min(len(data),s+2_000_000)): continue
                  blob=data[s:e]
                  if not any(n.encode() in blob for n in target_names): continue
                  fd=descriptor_pb2.FileDescriptorProto()
                  try: fd.ParseFromString(blob)
                  except DecodeError: continue
                  names={m.name for m in fd.message_type}
                  if not names & target_names: continue
                  key=(fd.name, s, e)
                  if key in seen: continue
                  seen.add(key)
                  item={'file_offset_start':hex(s),'file_offset_end':hex(e),'name':fd.name,'package':fd.package,'syntax':fd.syntax,'messages':[],'enums':[]}
                  for m in fd.message_type:
                      if m.name in target_names or 'Login' in m.name or 'Challenge' in m.name:
                          item['messages'].append({'name':m.name,'fields':[{'name':f.name,'number':f.number,'label':f.label,'type':f.type,'type_name':f.type_name,'oneof_index':f.oneof_index if f.HasField('oneof_index') else None,'default':f.default_value} for f in m.field]})
                  for en in fd.enum_type:
                      if 'GameclientMessageType' in en.name or 'GameserverMessageType' in en.name:
                          item['enums'].append({'name':en.name,'values':[{'name':v.name,'number':v.number} for v in en.value]})
                  parsed.append(item)
          (out/'parsed-protobuf-descriptors.json').write_text(json.dumps(parsed, indent=2, ensure_ascii=False))

          # Compact evidence summary.
          summary=[]
          summary.append(f'parsed_descriptors={len(parsed)}')
          for fd in parsed:
              summary.append(f"descriptor={fd['name']} package={fd['package']} syntax={fd['syntax']}")
              for m in fd['messages']:
                  summary.append('message '+m['name'])
                  for f in m['fields']:
                      summary.append(f"  field {f['number']} {f['name']} label={f['label']} type={f['type']} type_name={f['type_name']}")
              for en in fd['enums']:
                  summary.append('enum '+en['name']+' '+', '.join(f"{v['name']}={v['number']}" for v in en['values']))
          summary.append(f'interesting_xrefs={len(hits)} caller_functions={len(caller_index)}')
          (out/'summary.txt').write_text('\n'.join(summary)+'\n')
          PY

          python /tmp/analyze.py "$client" "$out"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print focused summary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              out=/analysis/client-analysis/${run_id}/report/protobuf-battleye-final
              cat "$out/summary.txt"
              echo "Files: $(find "$out" -type f | wc -l)"
              echo "Bytes: $(du -sb "$out" | cut -f1)"
            '

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-linux-protobuf-battleye-final"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/protobuf-battleye-final/." "$out/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-protobuf-battleye-final
          path: ${{ runner.temp }}/tibia-linux-protobuf-battleye-final
          retention-days: 1
