name: Tibia Linux mapped login functions

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export mapped login target functions
    runs-on: oteryn-staging
    timeout-minutes: 8
    steps:
      - name: Generate target disassembly from persisted map
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/qt-jump-targets"
          test -s "${out}/selected.tsv"
          mkdir -p "${out}/functions"
          cat "${out}/jump-targets.txt"
          echo '===== SELECTED ====='
          cat "${out}/selected.tsv"
          while IFS="$(printf '\t')" read -r class_name index method target start end; do
            [ -n "${target}" ] || continue
            max_end=$((0x${start}+0x9000))
            actual_end=$((0x${end}))
            if [ "${actual_end}" -gt "${max_end}" ]; then actual_end="${max_end}"; fi
            stop_hex="$(printf '0x%x' "${actual_end}")"
            safe="${class_name}-${index}-${method}"
            objdump -d -M intel --no-show-raw-insn \
              --start-address="0x${start}" --stop-address="${stop_hex}" "${client}" \
              > "${out}/functions/${safe}.txt"
          done < "${out}/selected.tsv"
          chmod -R a+rX "${out}"
          SCRIPT
      - name: Copy mapped report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-qt-jump-targets"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/qt-jump-targets/." "${out}/"
      - name: Upload mapped report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-qt-jump-targets
          path: ${{ runner.temp }}/tibia-qt-jump-targets
          retention-days: 1
