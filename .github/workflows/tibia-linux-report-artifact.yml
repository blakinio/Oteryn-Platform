name: Tibia Linux protected route policy pivots

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-protected-route-policy
  cancel-in-progress: true

jobs:
  trace:
    name: Resolve protected and unprotected route policy
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Disassemble exact policy functions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id=$(cat /analysis/latest-client-analysis-run-id)
          client=/analysis/client-analysis/${run_id}/download/client
          out=/analysis/client-analysis/${run_id}/report/protected-route-policy-final
          rm -rf "$out" && mkdir -p "$out/functions"

          python3 - "$client" "$out" <<'PY'
          import pathlib, re, subprocess, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          binary,out_dir=sys.argv[1:]
          targets={
            'useProtectedNetworkRoute_init':0x693117,
            'world_address_config_consumer':0x6f12dd,
            'world_address_config_consumer_2':0x6f138d,
            'protected_world_address_runtime':0xe1b509,
            'unprotected_world_address_runtime':0xe1b649,
            'world_address_static_init':0x69c406,
          }
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); sections=list(elf.iter_sections())
              fdes=[]
              try:
                  for e in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(e,FDE):
                          s=int(e['initial_location']); fdes.append((s,s+int(e['address_range'])))
              except Exception: pass

          def frange(addr):
              m=[x for x in fdes if x[0]<=addr<x[1]]
              return min(m,key=lambda x:x[1]-x[0]) if m else (addr-0x100,addr+0x1000)
          def locate(va):
              for sec in sections:
                  a=int(sec['sh_addr']); n=int(sec['sh_size'])
                  if a<=va<a+n:return int(sec['sh_offset'])+va-a,sec.name
              return None,None

          refs=set(); index=[]
          for name,addr in targets.items():
              s,e=frange(addr); e=min(e,s+0x10000)
              dis=subprocess.check_output(['objdump','-d','-M','intel','--no-show-raw-insn',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
              pathlib.Path(out_dir,'functions',f'{name}-0x{addr:x}.txt').write_text(dis)
              refs.update(int(x,16) for x in re.findall(r'#\s*([0-9a-fA-F]+)',dis))
              index.append(f'{name}\ttarget=0x{addr:x}\trange=0x{s:x}-0x{e:x}')
          pathlib.Path(out_dir,'index.txt').write_text('\n'.join(index)+'\n')

          rows=[]
          for va in sorted(refs):
              off,sec=locate(va)
              if off is None: continue
              end=blob.find(b'\0',off,min(len(blob),off+1200)); value=None
              if end>off:
                  raw=blob[off:end]
                  if raw and sum(32<=b<127 or b in (9,10,13) for b in raw)/len(raw)>0.9:
                      value=raw.decode('utf-8','replace')
              if value or sec in ('.data.rel.ro','.rodata','.bss'):
                  rows.append(f'0x{va:x}\t{sec}\t{value!r}')
          pathlib.Path(out_dir,'referenced-data.txt').write_text('\n'.join(rows)+'\n')
          PY

          {
            echo '===== INDEX ====='; cat "$out/index.txt"
            echo '===== REFERENCED DATA ====='; cat "$out/referenced-data.txt"
            for f in "$out"/functions/*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
            done
          } > "$out/complete.txt"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print focused result
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 sh -lc '
            run_id=$(cat /analysis/latest-client-analysis-run-id)
            root=/analysis/client-analysis/${run_id}/report/protected-route-policy-final
            echo "===== INDEX ====="; cat "$root/index.txt"
            echo "===== STRINGS ====="; grep -Ei "protected|unprotected|route|world|network|battle|address|port|option|setting" "$root/referenced-data.txt" || true
            for f in "$root"/functions/*.txt; do
              echo "===== $(basename "$f") ====="
              grep -n -B 25 -A 70 -E "(31e87c0|318d3d0|318d3f0|useProtected|ProtectedWorld|UnprotectedWorld|call[[:space:]]|cmp|test|cmov|sete|setne|QUrl|QHostAddress|port|address)" "$f" || true
            done
          '

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-protected-route-policy"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/protected-route-policy-final/." "$out/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-protected-route-policy-final
          path: ${{ runner.temp }}/tibia-protected-route-policy
          retention-days: 1
