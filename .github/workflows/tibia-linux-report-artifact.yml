name: Tibia Linux protobuf and BattlEye focus

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-protobuf-battleye-focus
  cancel-in-progress: true

jobs:
  analyze:
    name: Extract bounded static evidence
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Extract callbacks descriptors and framing
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.13-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils file >/dev/null
          pip install --no-cache-dir pyelftools protobuf >/dev/null

          run_id=$(cat /analysis/latest-client-analysis-run-id)
          root=/analysis/client-analysis/${run_id}
          client=${root}/download/client
          out=${root}/report/protobuf-battleye-final
          rm -rf "$out"
          mkdir -p "$out/functions"
          test "$(sha256sum "$client" | awk '{print $1}')" = "8b25d65ece158723dbb50a1b592c1ec8a3247a650fcd2d299bebdfd133cb5752"

          dump() {
            name=$1 start=$2 stop=$3
            objdump -d -M intel --start-address="$start" --stop-address="$stop" "$client" > "$out/functions/$name.txt"
          }

          # Exact adjacent callback boundaries observed in the Init parameter block.
          dump BE-callback-7418f0 0x7418f0 0x741b50
          dump BE-callback-741b50 0x741b50 0x741de0
          dump BE-callback-741de0 0x741de0 0x742100
          dump BE-session-dispatch-6f8000 0x6f8000 0x6f86a0
          dump BE-setup-6fadb0 0x6fadb0 0x6fc700

          # Login builder, handler dispatch, generated serializers and response handlers.
          dump login-builder-e19700 0xe19700 0xe1a740
          dump login-handler-metacall-cf1600 0xcf1600 0xcf1b80
          dump login-generated-bd10e0 0xbd10e0 0xbd1a80
          dump login-generated-bd18d0 0xbd18d0 0xbd2200
          dump secondary-generated-1763930 0x1763930 0x1764200
          dump secondary-generated-17a7470 0x17a7470 0x17a7d00
          dump login-success-e10df0 0xe10df0 0xe11040
          dump dual-packet-b487f0 0xb487f0 0xb48ab0
          dump tcp-connect-b403c0 0xb403c0 0xb40800

          cat > /tmp/parse.py <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from google.protobuf import descriptor_pb2
          from google.protobuf.message import DecodeError

          client=Path(__import__('sys').argv[1]); out=Path(__import__('sys').argv[2]); data=client.read_bytes()
          targets={
            'GameclientMessageLogin','GameclientMessageSecondaryLogin',
            'GameserverMessageLoginChallenge','GameserverMessageLoginSuccess'
          }

          def varint(buf,p):
            v=0; s=0
            for i in range(10):
              if p+i>=len(buf): raise ValueError
              b=buf[p+i]; v|=(b&127)<<s
              if not b&128: return v,p+i+1
              s+=7
            raise ValueError

          # Candidate FileDescriptorProto starts are field-1 strings ending in .proto.
          starts=[]; pos=0
          while True:
            pos=data.find(b'.proto',pos)
            if pos<0: break
            for back in range(2,260):
              s=pos-back
              if s<0 or data[s]!=0x0a: continue
              try: n,q=varint(data,s+1)
              except ValueError: continue
              if q+n==pos+6 and 1<=n<=250:
                raw=data[q:q+n]
                if all(32<=c<127 for c in raw): starts.append((s,raw.decode('ascii','replace')))
            pos+=6
          starts=sorted(set(starts))

          parsed=[]; seen=set()
          for s,name in starts:
            limit=min(len(data),s+1_500_000)
            ends=[]
            for marker in (b'\x62\x06proto2',b'\x62\x06proto3'):
              p=s
              while True:
                p=data.find(marker,p,limit)
                if p<0: break
                ends.append(p+len(marker)); p+=1
            for e in sorted(set(ends)):
              blob=data[s:e]
              if not any(t.encode() in blob for t in targets): continue
              fd=descriptor_pb2.FileDescriptorProto()
              try: fd.ParseFromString(blob)
              except DecodeError: continue
              if not fd.name.endswith('.proto'): continue
              all_messages=[]
              def walk(prefix, msgs):
                for m in msgs:
                  full=(prefix+'.'+m.name).strip('.')
                  all_messages.append((full,m))
                  walk(full,m.nested_type)
              walk('',fd.message_type)
              if not any(m.name in targets for _,m in all_messages): continue
              key=(s,e,fd.name)
              if key in seen: continue
              seen.add(key)
              item={'start':hex(s),'end':hex(e),'file':fd.name,'package':fd.package,'syntax':fd.syntax,'messages':[],'enums':[]}
              for full,m in all_messages:
                if m.name in targets or 'Login' in m.name or 'Challenge' in m.name:
                  item['messages'].append({'name':full,'fields':[{
                    'name':f.name,'number':f.number,'label':descriptor_pb2.FieldDescriptorProto.Label.Name(f.label),
                    'type':descriptor_pb2.FieldDescriptorProto.Type.Name(f.type),'type_name':f.type_name,
                    'default':f.default_value,'oneof_index':f.oneof_index if f.HasField('oneof_index') else None
                  } for f in m.field]})
              for en in fd.enum_type:
                if 'MessageType' in en.name or 'Login' in en.name:
                  item['enums'].append({'name':en.name,'values':[{'name':v.name,'number':v.number} for v in en.value]})
              parsed.append(item)

          # Raw printable contexts are useful even if the descriptor is split or custom-packed.
          contexts=[]
          for needle in [b'GameclientMessageLogin',b'GameclientMessageSecondaryLogin',b'GameserverMessageLoginChallenge',b'clientsessionid',b'charactername',b'sessionkey']:
            p=0
            while True:
              p=data.find(needle,p)
              if p<0: break
              a=max(0,p-512); b=min(len(data),p+2048)
              chunk=data[a:b]
              strings=[]; cur=[]
              for x in chunk:
                if 32<=x<127: cur.append(chr(x))
                else:
                  if len(cur)>=3: strings.append(''.join(cur))
                  cur=[]
              if len(cur)>=3: strings.append(''.join(cur))
              contexts.append({'needle':needle.decode(),'offset':hex(p),'strings':strings})
              p+=len(needle)

          (out/'descriptor-candidates.json').write_text(json.dumps({'starts':[{'offset':hex(s),'name':n} for s,n in starts],'parsed':parsed},indent=2,ensure_ascii=False))
          (out/'string-contexts.json').write_text(json.dumps(contexts,indent=2,ensure_ascii=False))

          lines=[f'candidate_proto_starts={len(starts)}',f'parsed_target_descriptors={len(parsed)}']
          for fd in parsed:
            lines.append(f"descriptor {fd['file']} package={fd['package']} syntax={fd['syntax']} start={fd['start']} end={fd['end']}")
            for m in fd['messages']:
              lines.append('message '+m['name'])
              for f in m['fields']:
                lines.append(f"  {f['number']} {f['name']} {f['label']} {f['type']} {f['type_name']}")
            for en in fd['enums']:
              lines.append('enum '+en['name']+' '+', '.join(f"{v['name']}={v['number']}" for v in en['values']))
          (out/'summary.txt').write_text('\n'.join(lines)+'\n')
          PY
          python /tmp/parse.py "$client" "$out"

          {
            echo '===== DIRECT CALLS / POINTERS IN FOCUSED FUNCTIONS ====='
            grep -RInE 'call|7418f0|741b50|741de0|QMetaObject|Serialize|connectToHost' "$out/functions" | head -n 6000 || true
          } > "$out/focused-index.txt"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print focused summary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              out=/analysis/client-analysis/${run_id}/report/protobuf-battleye-final
              cat "$out/summary.txt"
              echo "Files: $(find "$out" -type f | wc -l)"
              echo "Bytes: $(du -sb "$out" | cut -f1)"
            '

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-linux-protobuf-battleye-final"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/protobuf-battleye-final/." "$out/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-protobuf-battleye-final
          path: ${{ runner.temp }}/tibia-linux-protobuf-battleye-final
          retention-days: 1
