name: Tibia Linux BattlEye Init call path

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export BattlEye Init control flow
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Generate annotated Init path
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          o="/analysis/client-analysis/${r}/report/battleye-init-path.txt"
          d=/tmp/init-path.txt
          objdump -d -M intel --no-show-raw-insn --start-address=0x6fb300 --stop-address=0x6fb760 "$c" > "$d"
          {
            echo '===== DISASSEMBLY ====='
            cat "$d"
            echo '===== REFERENCED STRINGS ====='
            python3 - "$c" "$d" <<'PY'
          import re,sys
          from elftools.elf.elffile import ELFFile
          binary,disasm=sys.argv[1:]
          text=open(disasm,errors='replace').read()
          vas=sorted({int(x,16) for x in re.findall(r'#\s*([0-9a-fA-F]+)',text)})
          with open(binary,'rb') as f:
              blob=f.read();f.seek(0);elf=ELFFile(f);secs=list(elf.iter_sections())
          def off(va):
              for s in secs:
                  a,z=int(s['sh_addr']),int(s['sh_size'])
                  if a<=va<a+z:return int(s['sh_offset'])+va-a,s.name
              return None,None
          for va in vas:
              p,sec=off(va);value=None
              if p is not None:
                  e=blob.find(b'\0',p,min(len(blob),p+400))
                  if e>p:
                      raw=blob[p:e]
                      if raw and sum(32<=b<127 or b in (9,10,13) for b in raw)/len(raw)>=.85:
                          value=raw.decode(errors='replace')
              if value is not None: print(f'va=0x{va:x} section={sec} string={value!r}')
          PY
          } > "$o"
          chmod a+r "$o"
          SCRIPT

      - name: Copy Init path report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/battleye-init-path.txt"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/battleye-init-path.txt" "$out"

      - name: Upload Init path text
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-battleye-init-path
          path: ${{ runner.temp }}/battleye-init-path.txt
          retention-days: 1
