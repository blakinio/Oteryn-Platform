name: Tibia Linux parser callback and network trace

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-parser-network-trace
  cancel-in-progress: true

jobs:
  trace:
    name: Trace parser callback registration and network stack
    runs-on: oteryn-staging
    timeout-minutes: 12

    steps:
      - name: Generate callback and network report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null

          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          out="/analysis/client-analysis/${r}/report/parser-network-trace"
          rm -rf "$out" && mkdir -p "$out"
          d=/tmp/client.disasm

          objdump -d -M intel --no-show-raw-insn "$c" > "$d"

          python3 - "$c" > "$out/parser-pointer-scan.txt" <<'PY'
          import struct, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          path = sys.argv[1]
          target = 0xE0FCF0
          with open(path, 'rb') as f:
              blob = f.read()
              f.seek(0)
              elf = ELFFile(f)
              sections = list(elf.iter_sections())

              def map_offset(off):
                  for sec in sections:
                      start = int(sec['sh_offset'])
                      size = int(sec['sh_size'])
                      if start <= off < start + size:
                          return sec.name, int(sec['sh_addr']) + off - start
                  return None, None

              print('===== EH FRAME FUNCTION RANGE =====')
              eh = elf.get_section_by_name('.eh_frame')
              found = False
              if eh is not None:
                  for entry in eh.iter_CFI_entries():
                      if isinstance(entry, FDE):
                          start = int(entry['initial_location'])
                          end = start + int(entry['address_range'])
                          if start <= target < end:
                              print(f'target=0x{target:x} function_start=0x{start:x} function_end=0x{end:x} size=0x{end-start:x}')
                              found = True
              if not found:
                  print('no_fde_found')

              print('===== ABSOLUTE POINTER OCCURRENCES =====')
              for width, packed in ((8, struct.pack('<Q', target)), (4, struct.pack('<I', target))):
                  pos = 0
                  count = 0
                  while True:
                      off = blob.find(packed, pos)
                      if off < 0:
                          break
                      sec, va = map_offset(off)
                      print(f'width={width} file_offset=0x{off:x} va={None if va is None else hex(va)} section={sec}')
                      count += 1
                      pos = off + 1
                  print(f'width={width} count={count}')
          PY

          readelf -rW "$c" | grep -Ei 'e0fcf0|0e0fcf0|E0FCF0' > "$out/parser-relocations.txt" || true

          {
            echo '===== NETWORK-RELATED DYNAMIC SYMBOLS ====='
            readelf -Ws "$c" | grep -Ei 'UND.*(connect|socket|send|recv|getaddrinfo|getnameinfo|poll|epoll|select|QAbstractSocket|QTcpSocket|QUdpSocket|QNetwork|QHostAddress|asio)' || true
            echo '===== NETWORK-RELATED CALL SITES ====='
            grep -E 'call[[:space:]].*<(connect|socket|send|recv|getaddrinfo|getnameinfo|poll|epoll|select|.*QAbstractSocket.*|.*QTcpSocket.*|.*QUdpSocket.*|.*QNetwork.*|.*QHostAddress.*)@plt>' "$d" || true
            echo '===== PARSER-AREA DIRECT CALLS ====='
            grep -E 'call[[:space:]]+e0f[0-9a-f]{3}([[:space:]]|<)' "$d" || true
            echo '===== RELEVANT TYPE / CLASS STRINGS ====='
            strings -a -t x -n 5 "$c" | grep -Ei 'tibia::.*(World|Connection|Network|Protocol|Session|Login|Socket|Route|AntiCheat)|T(World|Connection|Network|Protocol|Session|Login|Socket|Route|AntiCheat)|ProtectedWorldAddress|UnprotectedWorldAddress|useProtectedNetworkRoute' | head -n 1500 || true
          } > "$out/network-index.txt"

          grep -B 24 -A 36 -E 'call[[:space:]].*<(connect|socket|getaddrinfo|.*QAbstractSocket.*|.*QTcpSocket.*|.*QHostAddress.*)@plt>' "$d" \
            | head -n 4000 > "$out/network-call-contexts.txt" || true

          pointer_vas="$(awk '/^width=/ && $0 !~ /section=.text/ {for(i=1;i<=NF;i++) if($i ~ /^va=/){sub(/^va=/,"",$i); if($i != "None") print substr($i,3)}}' "$out/parser-pointer-scan.txt" | sort -u)"
          : > "$out/parser-pointer-xrefs.txt"
          for va in $pointer_vas; do
            echo "===== POINTER SLOT 0x${va} =====" >> "$out/parser-pointer-xrefs.txt"
            grep -B 24 -A 36 -E "#[[:space:]]*${va}([^0-9a-f]|$)" "$d" >> "$out/parser-pointer-xrefs.txt" || true
          done

          chmod -R a+rX "$out"
          SCRIPT

      - name: Copy callback and network report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-parser-network-trace"
          rm -rf "$out" && mkdir -p "$out"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/parser-network-trace/." "$out/"

      - name: Upload callback and network report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-parser-network-trace
          path: ${{ runner.temp }}/tibia-parser-network-trace
          retention-days: 1
