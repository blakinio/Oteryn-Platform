name: Tibia Linux TCP route selector

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-tcp-route-selector
  cancel-in-progress: true

jobs:
  trace:
    name: Trace TCP route selection and BattlEye resume callback
    runs-on: oteryn-staging
    timeout-minutes: 15

    steps:
      - name: Generate route-selector report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null

          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/tcp-route-selector"
          rm -rf "${out}" && mkdir -p "${out}/functions" "${out}/contexts"
          full=/tmp/client.disasm

          python3 - "${client}" "${out}" <<'PY'
          import pathlib, struct, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          binary, out_dir = sys.argv[1:]
          targets = [
              ('TGameserverTCPConnection_ctor', 0x196e3d0),
              ('tcp_vslot_3', 0x7e32f0),
              ('tcp_vslot_4', 0x7e33d0),
              ('tcp_secondary_slot_0', 0x7e3060),
              ('tcp_secondary_slot_1', 0x7e31a0),
              ('tcp_qt_metacall', 0xdc5da0),
              ('tcp_qt_metacast_or_meta', 0xdd4670),
              ('tcp_qobject_method', 0xdd7b70),
              ('BE_setup_and_session_resume', 0x6fadb0),
              ('BE_callback_window', 0x6fb500),
              ('GameserverSession_initialize', 0x7e6a40),
          ]

          with open(binary, 'rb') as f:
              blob = f.read(); f.seek(0); elf = ELFFile(f); sections = list(elf.iter_sections())
              fdes = []
              try:
                  dwarf = elf.get_dwarf_info()
                  for entry in dwarf.EH_CFI_entries():
                      if isinstance(entry, FDE):
                          start = int(entry['initial_location'])
                          fdes.append((start, start + int(entry['address_range'])))
              except Exception:
                  pass

              def function_range(address):
                  candidates = [(s, e) for s, e in fdes if s <= address < e]
                  if candidates:
                      return min(candidates, key=lambda x: x[1] - x[0])
                  return address, address + 0x5000

              def va_to_offset(va):
                  for sec in sections:
                      start = int(sec['sh_addr']); size = int(sec['sh_size'])
                      if start <= va < start + size:
                          return int(sec['sh_offset']) + va - start, sec.name
                  return None, None

              resolved = {}
              for sec in sections:
                  if sec['sh_type'] != 'SHT_RELA':
                      continue
                  linked = elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      slot = int(rel['r_offset']); typ = int(rel['r_info_type'])
                      addend = int(rel['r_addend']) if rel.is_RELA() else 0
                      value = None
                      if typ == 8:
                          value = addend
                      elif linked is not None and int(rel['r_info_sym']):
                          sym = linked.get_symbol(int(rel['r_info_sym']))
                          sym_value = int(sym['st_value'])
                          if sym_value:
                              value = sym_value + addend
                      if value is not None:
                          resolved[slot] = value

              def raw_qword(va):
                  off, _ = va_to_offset(va)
                  if off is None or off + 8 > len(blob): return None
                  return struct.unpack_from('<Q', blob, off)[0]

              def qword(va):
                  return resolved.get(va, raw_qword(va))

              def section_of(va):
                  return va_to_offset(va)[1]

              lines = []
              for name, address in targets:
                  start, end = function_range(address)
                  lines.append(f'{name}\t{address:x}\t{start:x}\t{end:x}')
              pathlib.Path(out_dir, 'ranges.tsv').write_text('\n'.join(lines) + '\n')

              vptrs = [0x3082b38, 0x3082b98, 0x3082ba8, 0x3076d20]
              report = []
              for vptr in vptrs:
                  report.append(f'===== VPTR 0x{vptr:x} =====')
                  typeinfo = qword(vptr - 8)
                  report.append(f'typeinfo={None if typeinfo is None else hex(typeinfo)} section={None if typeinfo is None else section_of(typeinfo)}')
                  if typeinfo:
                      name_ptr = qword(typeinfo + 8)
                      name = None
                      if name_ptr:
                          off, sec = va_to_offset(name_ptr)
                          if off is not None:
                              end = blob.find(b'\0', off, min(len(blob), off + 500))
                              if end > off:
                                  name = blob[off:end].decode('utf-8', errors='replace')
                          report.append(f'typeinfo_name_ptr=0x{name_ptr:x} name={name!r}')
                  for index in range(32):
                      target = qword(vptr + index * 8)
                      report.append(
                          f'slot={index} slot_va=0x{vptr + index*8:x} '
                          f'target={None if target is None else hex(target)} '
                          f'section={None if target is None else section_of(target)}'
                      )
                  report.append('')
              pathlib.Path(out_dir, 'vtable-map.txt').write_text('\n'.join(report) + '\n')
          PY

          while IFS="$(printf '\t')" read -r name address start end; do
            [ -n "${address}" ] || continue
            max_end=$((0x${start} + 0x18000))
            actual_end=$((0x${end}))
            if [ "${actual_end}" -gt "${max_end}" ]; then actual_end="${max_end}"; fi
            stop_hex="$(printf '0x%x' "${actual_end}")"
            objdump -d -M intel --no-show-raw-insn \
              --start-address="0x${start}" --stop-address="${stop_hex}" "${client}" \
              > "${out}/functions/${name}.txt"
          done < "${out}/ranges.tsv"

          objdump -d -M intel --no-show-raw-insn "${client}" > "${full}"

          {
            echo '===== ROUTE MEMBER OFFSET REFERENCES ====='
            grep -E '\[[^]]+\+(0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da)\]' "${full}" || true
            echo '===== CONNECT-RELATED DYNAMIC SYMBOLS ====='
            readelf -Ws "${client}" | grep -Ei '(connectToHost|waitForConnected|QAbstractSocket|QTcpSocket|QHostAddress|peerAddress|peerPort|socketDescriptor|connect@|getaddrinfo|socket@)' || true
            echo '===== CONNECT-RELATED CALLS ====='
            grep -E 'call[[:space:]].*<(.*connectToHost.*|.*waitForConnected.*|.*QAbstractSocket.*|.*QTcpSocket.*|connect@plt|getaddrinfo@plt|socket@plt)>' "${full}" || true
            echo '===== KNOWN TCP VTABLE TARGET CALLERS ====='
            grep -E 'call[[:space:]]+(7e3060|7e31a0|7e32f0|7e33d0|196e3d0)([[:space:]]|<)' "${full}" || true
          } > "${out}/global-index.txt"

          grep -n -B 28 -A 45 -E '\[[^]]+\+(0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da)\]' "${full}" \
            | head -n 6000 > "${out}/contexts/route-offset-contexts.txt" || true

          grep -n -B 35 -A 60 -E 'call[[:space:]].*<(.*connectToHost.*|.*waitForConnected.*|.*QAbstractSocket.*|.*QTcpSocket.*|connect@plt|getaddrinfo@plt|socket@plt)>' "${full}" \
            | head -n 6000 > "${out}/contexts/connect-call-contexts.txt" || true

          objdump -d -M intel --no-show-raw-insn \
            --start-address=0x6fb470 --stop-address=0x6fb900 "${client}" \
            > "${out}/BE-callback-setup.txt"

          {
            echo '===== BE CALLBACK SETUP CALLS ====='
            grep -n -B 18 -A 32 -E '(call|lea).*' "${out}/BE-callback-setup.txt" || true
            echo '===== BE STATE OFFSETS ====='
            grep -n -B 10 -A 20 -E '\[[^]]+\+(0x28|0x30|0x48|0x49|0x4a|0x4b)\]' "${out}/BE-callback-setup.txt" || true
          } > "${out}/BE-callback-focus.txt"

          python3 - "${client}" "${out}/BE-callback-setup.txt" "${out}"/functions/*.txt > "${out}/referenced-data.txt" <<'PY'
          import re, sys
          from elftools.elf.elffile import ELFFile
          binary, *inputs = sys.argv[1:]
          addresses = set()
          for path in inputs:
              text = open(path, encoding='utf-8', errors='replace').read()
              addresses.update(int(x, 16) for x in re.findall(r'#\s*([0-9a-fA-F]+)', text))
          with open(binary, 'rb') as f:
              blob = f.read(); f.seek(0); elf = ELFFile(f); sections = list(elf.iter_sections())
          def va_to_offset(va):
              for sec in sections:
                  start = int(sec['sh_addr']); size = int(sec['sh_size'])
                  if start <= va < start + size:
                      return int(sec['sh_offset']) + va - start, sec.name
              return None, None
          for va in sorted(addresses):
              off, sec = va_to_offset(va)
              if off is None: continue
              end = blob.find(b'\0', off, min(len(blob), off + 700))
              value = None
              if end > off:
                  raw = blob[off:end]
                  if raw and sum(32 <= b < 127 or b in (9,10,13) for b in raw) / len(raw) > 0.9:
                      value = raw.decode('utf-8', errors='replace')
              print(f'va=0x{va:x} section={sec} string={value!r}')
          PY

          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy route-selector report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-tcp-route-selector"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/tcp-route-selector/." "${out}/"

      - name: Upload route-selector report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-tcp-route-selector
          path: ${{ runner.temp }}/tibia-tcp-route-selector
          retention-days: 1
