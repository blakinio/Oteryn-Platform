name: Tibia Linux Qt relocation neighborhoods

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-targeted-qt-metaobject
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect Qt string-table relocation neighborhoods
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Generate relocation neighborhood report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/qt-relocation-neighborhoods"
          rm -rf "${out}" && mkdir -p "${out}"

          python3 - "${client}" > "${out}/report.txt" <<'PY'
          import struct, sys
          from elftools.elf.elffile import ELFFile

          path=sys.argv[1]
          ranges=[(0x1c87000,0x1c8b000,'authentication'),(0x1c90000,0x1c94000,'gameclient')]
          with open(path,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              def v2o(v):
                  for s in secs:
                      a=int(s['sh_addr']); z=int(s['sh_size'])
                      if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
                  return None,None
              def qraw(v):
                  o,_=v2o(v)
                  if o is None or o+8>len(blob):return None
                  return struct.unpack_from('<Q',blob,o)[0]
              relocs={}; rows=[]
              for s in secs:
                  if s['sh_type']!='SHT_RELA':continue
                  linked=elf.get_section(s['sh_link']) if s['sh_link'] else None
                  for r in s.iter_relocations():
                      slot=int(r['r_offset']); typ=int(r['r_info_type']); add=int(r['r_addend']) if r.is_RELA() else 0
                      val=None; sym=''
                      if typ==8:val=add
                      elif linked is not None and int(r['r_info_sym']):
                          sy=linked.get_symbol(int(r['r_info_sym'])); sym=sy.name; sv=int(sy['st_value'])
                          if sv:val=sv+add
                      if val is not None:relocs[slot]=val
                      rows.append((slot,typ,add,val,sym,s.name))
              def q(v):return relocs.get(v,qraw(v))
              def sec(v):return v2o(v)[1]
              def text(v,limit=120):
                  o,s=v2o(v)
                  if o is None:return None
                  e=blob.find(b'\0',o,min(len(blob),o+limit))
                  if e<=o:return None
                  raw=blob[o:e]
                  if sum(32<=b<127 for b in raw)/len(raw)<.92:return None
                  return raw.decode('utf-8',errors='replace')

              selected=[]
              for row in rows:
                  slot,typ,add,val,sym,rs=row
                  for lo,hi,label in ranges:
                      if lo<=add<hi or (val is not None and lo<=val<hi):
                          selected.append((label,row));break
              print(f'selected_relocation_count={len(selected)}')
              for label,(slot,typ,add,val,sym,rs) in selected:
                  print(f'===== {label} relocation slot=0x{slot:x} slot_section={sec(slot)} type={typ} addend=0x{add:x} value={None if val is None else hex(val)} symbol={sym!r} reloc_section={rs} =====')
                  for delta in range(-0x30,0x49,8):
                      va=slot+delta; value=q(va)
                      print(f'  slot{delta:+#x}=0x{va:x} raw={None if qraw(va) is None else hex(qraw(va))} resolved={None if value is None else hex(value)} target_section={None if value is None else sec(value)} text={None if value is None else text(value)!r}')
              print('===== EXACT TARGET STRING BYTES =====')
              for va in (0x1c89a30,0x1c89d7a,0x1c9211b,0x1c9229f,0x1c922bb):
                  print(f'va=0x{va:x} section={sec(va)} text={text(va,200)!r}')
          PY
          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-qt-relocation-neighborhoods"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/qt-relocation-neighborhoods/." "${out}/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-qt-relocation-neighborhoods
          path: ${{ runner.temp }}/tibia-qt-relocation-neighborhoods
          retention-days: 1
