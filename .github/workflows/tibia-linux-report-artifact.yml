name: Tibia Linux runtime route consumer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export runtime route-selection consumer
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Generate route-consumer slices
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils grep >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          root="/analysis/client-analysis/${r}/report/runtime-route-consumer"
          xrefs="/analysis/client-analysis/${r}/report/route-state-xrefs.txt"
          rm -rf "$root" && mkdir -p "$root"

          {
            echo '===== RUNTIME XREFS ONLY ====='
            grep -E '^[[:space:]]+[0-9a-f]+:' "$xrefs" \
              | grep -Ev '^[[:space:]]+60f|^[[:space:]]+69311e|^[[:space:]]+69c40d|^[[:space:]]+69c431' || true
            echo '===== COUNTS ====='
            sed -n '/===== COUNTS =====/,$p' "$xrefs"
          } > "$root/runtime-xrefs.txt"

          objdump -d -M intel --no-show-raw-insn \
            --start-address=0xe0fc80 --stop-address=0xe10080 \
            "$c" > "$root/login-response-consumer.txt"

          # Consumers of logical route choice and resolved world addresses.
          objdump -d -M intel --no-show-raw-insn \
            --start-address=0x0 --stop-address=0x0 "$c" > /dev/null 2>&1 || true

          chmod -R a+rX "$root"
          SCRIPT

      - name: Copy runtime route report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-runtime-route-consumer"
          rm -rf "$out" && mkdir -p "$out"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/runtime-route-consumer/." "$out/"

      - name: Upload runtime route report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-runtime-route-consumer
          path: ${{ runner.temp }}/tibia-runtime-route-consumer
          retention-days: 1
