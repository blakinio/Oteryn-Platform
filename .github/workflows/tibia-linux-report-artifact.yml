name: Tibia Linux TCP connect and login message trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-tcp-login-message-trace
  cancel-in-progress: true

jobs:
  trace:
    name: Trace TCP connect and login message construction
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Analyze TCP vtable and login protobuf classes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id=$(cat /analysis/latest-client-analysis-run-id)
          client=/analysis/client-analysis/${run_id}/download/client
          out=/analysis/client-analysis/${run_id}/report/tcp-login-final
          rm -rf "$out" && mkdir -p "$out/functions"

          strings -a -t x "$client" | grep -E 'TLoginProtocolMessageHandler|GameclientMessage(Login|SecondaryLogin)|GameserverMessageLogin(Challenge|Success|Error|Wait|Advice)|sessionkey|charactername|challenge|account|clientversion|assetversion' > "$out/relevant-strings.txt" || true

          python3 - "$client" "$out" <<'PY'
          import pathlib, re, struct, subprocess, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          binary,out_dir=sys.argv[1:]
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); sections=list(elf.iter_sections())
              resolved={}
              for sec in sections:
                  if sec['sh_type']!='SHT_RELA': continue
                  linked=elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      slot=int(rel['r_offset']); typ=int(rel['r_info_type']); add=int(rel['r_addend']) if rel.is_RELA() else 0
                      val=None
                      if typ==8: val=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sym=linked.get_symbol(int(rel['r_info_sym'])); base=int(sym['st_value'])
                          if base: val=base+add
                      if val is not None: resolved[slot]=val
              fdes=[]
              try:
                  for e in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(e,FDE):
                          s=int(e['initial_location']); fdes.append((s,s+int(e['address_range'])))
              except Exception: pass

          def locate(va):
              for sec in sections:
                  a=int(sec['sh_addr']); n=int(sec['sh_size'])
                  if a<=va<a+n:return int(sec['sh_offset'])+va-a,sec.name
              return None,None
          def qword(va):
              if va in resolved:return resolved[va]
              off,_=locate(va)
              return None if off is None else struct.unpack_from('<Q',blob,off)[0]
          def cstr(va,limit=1000):
              off,sec=locate(va)
              if off is None:return None,sec
              end=blob.find(b'\0',off,min(len(blob),off+limit))
              if end<=off:return None,sec
              try:return blob[off:end].decode('utf-8'),sec
              except:return None,sec
          def frange(addr):
              m=[x for x in fdes if x[0]<=addr<x[1]]
              return min(m,key=lambda x:x[1]-x[0]) if m else (addr,addr+0x5000)
          def disasm(name,addr,cap=0x18000):
              s,e=frange(addr); e=min(e,s+cap)
              text=subprocess.check_output(['objdump','-d','-M','intel','--no-show-raw-insn',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
              pathlib.Path(out_dir,'functions',f'{name}-0x{addr:x}.txt').write_text(text)
              return s,e,text

          # Exact TCP QObject vptr from its constructor. Resolve the connect virtual at +0xf8.
          tcp_vptr=0x3082b38
          rows=[f'TCP_VPTR=0x{tcp_vptr:x}']
          for i in range(0,40):
              t=qword(tcp_vptr+i*8)
              rows.append(f'slot={i} off=0x{i*8:x} target={None if t is None else hex(t)} section={None if t is None else locate(t)[1]}')
          connect_target=qword(tcp_vptr+0xf8)
          rows.append(f'CONNECT_SLOT31={None if connect_target is None else hex(connect_target)}')
          pathlib.Path(out_dir,'tcp-vtable.txt').write_text('\n'.join(rows)+'\n')
          if connect_target: disasm('tcp-connect-slot31',connect_target)

          # Find RTTI/typeinfo/vtables by exact embedded class names.
          names=[
              'N5tibia14authentication28TLoginProtocolMessageHandlerE',
              'N5tibia8protobuf8protocol22GameclientMessageLoginE',
              'N5tibia8protobuf8protocol31GameclientMessageSecondaryLoginE',
          ]
          discoveries=[]; targets=[]
          for raw_name in names:
              needle=raw_name.encode()+b'\0'; pos=blob.find(needle)
              discoveries.append(f'name={raw_name} file_offset={pos}')
              if pos<0: continue
              name_va=None
              for sec in sections:
                  so=int(sec['sh_offset']); sn=int(sec['sh_size'])
                  if so<=pos<so+sn:
                      name_va=int(sec['sh_addr'])+pos-so; break
              discoveries.append(f'  name_va=0x{name_va:x}')
              ti_slots=[slot for slot,val in resolved.items() if val==name_va]
              for slot in ti_slots:
                  discoveries.append(f'  typeinfo_name_ref_slot=0x{slot:x}')
                  ti=slot-8
                  ti_refs=[s for s,v in resolved.items() if v==ti]
                  for vr in ti_refs:
                      vptr=vr+8
                      discoveries.append(f'    typeinfo=0x{ti:x} vtable_ref=0x{vr:x} vptr=0x{vptr:x}')
                      for i in range(0,30):
                          t=qword(vptr+i*8)
                          if t and locate(t)[1]=='.text':
                              targets.append((raw_name,i,t))
          pathlib.Path(out_dir,'rtti-discovery.txt').write_text('\n'.join(discoveries)+'\n')

          seen=set(); target_rows=[]
          for label,i,t in targets:
              target_rows.append(f'{label}\tslot={i}\ttarget=0x{t:x}')
              if t not in seen:
                  disasm(f'rtti-slot{i}',t,0x8000); seen.add(t)
          pathlib.Path(out_dir,'rtti-targets.tsv').write_text('\n'.join(target_rows)+'\n')

          # Scan code for references to discovered vptrs/typeinfo and relevant descriptor strings.
          objdump=subprocess.check_output(['objdump','-d','-M','intel','--no-show-raw-insn',binary],text=True,errors='replace')
          interesting=[]
          addr_set=set()
          for line in discoveries:
              addr_set.update(int(x,16) for x in re.findall(r'0x([0-9a-f]+)',line))
          # Known readable descriptor/name addresses from strings report.
          for needle in (b'tibia::protobuf::protocol::GameclientMessageLogin\0', b'tibia::protobuf::protocol::GameclientMessageSecondaryLogin\0', b'tibia::authentication::TLoginProtocolMessageHandler\0'):
              start=0
              while True:
                  p=blob.find(needle,start)
                  if p<0: break
                  for sec in sections:
                      so=int(sec['sh_offset']); sn=int(sec['sh_size'])
                      if so<=p<so+sn: addr_set.add(int(sec['sh_addr'])+p-so); break
                  start=p+1
          for line in objdump.splitlines():
              m=re.search(r'#\s*([0-9a-fA-F]+)',line)
              if m and int(m.group(1),16) in addr_set:
                  interesting.append(line)
          pathlib.Path(out_dir,'code-xrefs.txt').write_text('\n'.join(interesting)+'\n')
          PY

          {
            echo '===== TCP VTABLE ====='; cat "$out/tcp-vtable.txt"
            echo '===== TCP CONNECT FUNCTION ====='; cat "$out"/functions/tcp-connect-slot31-* 2>/dev/null || true
            echo '===== RTTI DISCOVERY ====='; cat "$out/rtti-discovery.txt"
            echo '===== RTTI TARGETS ====='; cat "$out/rtti-targets.tsv"
            echo '===== CODE XREFS ====='; cat "$out/code-xrefs.txt"
            echo '===== RELEVANT STRINGS ====='; cat "$out/relevant-strings.txt"
          } > "$out/concise.txt"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print concise findings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 sh -lc '
            run_id=$(cat /analysis/latest-client-analysis-run-id)
            sed -n "1,7000p" /analysis/client-analysis/${run_id}/report/tcp-login-final/concise.txt
          '

      - name: Copy report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-tcp-login-final"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/tcp-login-final/." "$out/"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-tcp-login-final
          path: ${{ runner.temp }}/tibia-tcp-login-final
          retention-days: 1
