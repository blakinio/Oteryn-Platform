name: Tibia Linux dynamic-loader callers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-loader-callers
  cancel-in-progress: true

jobs:
  callers:
    name: Find loader wrapper callers
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Persist exact caller instructions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils grep >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          o="/analysis/client-analysis/${r}/report/loader-callers.txt"
          d=/tmp/client.disasm
          objdump -d -M intel --no-show-raw-insn "$c" > "$d"
          {
            echo '===== LOAD-LIBRARY WRAPPER CALLERS ====='
            grep -E 'call[[:space:]]+19f17e9([[:space:]]|<)' "$d" || true
            echo '===== CLOSE-LIBRARY WRAPPER CALLERS ====='
            grep -E 'call[[:space:]]+19f1863([[:space:]]|<)' "$d" || true
            echo '===== LOAD-SYMBOL WRAPPER CALLERS ====='
            grep -E 'call[[:space:]]+19f1882([[:space:]]|<)' "$d" || true
            echo '===== GETVER STRING LOCATIONS ====='
            strings -a -t x -n 4 "$c" | grep -E '[[:space:]]GetVer$' || true
            echo '===== INIT STRING LOCATIONS ====='
            strings -a -t x -n 4 "$c" | grep -E '[[:space:]]Init$' || true
            echo '===== BECLIENT STRING LOCATIONS ====='
            strings -a -t x -n 4 "$c" | grep -Ei 'BEClient|BattlEye/|BECLIENT_1\.0' || true
          } > "$o"
          chmod a+r "$o"
          SCRIPT

      - name: Print exact caller report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -c 'r=$(cat /analysis/latest-client-analysis-run-id); cat "/analysis/client-analysis/$r/report/loader-callers.txt"'
