name: Tibia Linux BattlEye loader trace

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Trace BEClient loading and route selectors
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Inspect imports and string locations
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          apk add --no-cache binutils coreutils >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"

          echo '===== UNDEFINED DYNAMIC SYMBOLS ====='
          readelf -Ws "${client}" | grep -Ei 'UND.*(dlopen|dlsym|dlclose|dlerror|pthread|socket|connect|send|recv)' || true
          echo '===== EXACT BE MODULE PATH STRINGS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'BEClient(_x64)?\.so|BattlEye/|BECLIENT_1\.0|GetVer|(^|[^A-Za-z])Init([^A-Za-z]|$)' | head -n 200 || true
          echo '===== ROUTE / ACTIVATION STRINGS WITH OFFSETS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'useProtectedNetworkRoute|ProtectedWorldAddress|UnprotectedWorldAddress|externaladdressprotected|externaladdressunprotected|externalportprotected|externalportunprotected|BattlEyeInitiallyActive|BattlEyeActivationTimestamp|availableBattlEyeTypes|initially_protected|anticheatprotection' | head -n 200 || true
          echo '===== DYNAMIC SECTION ====='
          readelf -d "${client}" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          echo '===== FILE IDENTITY ====='
          stat -c 'size=%s' "${client}"
          sha256sum "${client}"
          SCRIPT
