name: Tibia Linux world-record connection trace

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-world-record-trace
  cancel-in-progress: true

jobs:
  trace:
    name: Trace parsed world record into connection code
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Generate world-record and socket call report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          r="$(cat /analysis/latest-client-analysis-run-id)"
          c="/analysis/client-analysis/${r}/download/client"
          out="/analysis/client-analysis/${r}/report/world-record-connection-trace"
          rm -rf "$out" && mkdir -p "$out"
          d=/tmp/client.disasm

          objdump -d -M intel --no-show-raw-insn "$c" > "$d"

          {
            echo '===== PARSER DIRECT CALLERS ====='
            grep -E 'call[[:space:]]+e0fcf0([[:space:]]|<)' "$d" || true
            echo '===== SOCKET/HOST IMPORTS ====='
            readelf -Ws "$c" | grep -Ei 'Q(AbstractSocket|TcpSocket).*connectToHost|QHostAddress|connectToHost' || true
            echo '===== SOCKET CONNECT CALL SITES ====='
            grep -E 'call[[:space:]].*<(.*connectToHost.*|_ZN15QAbstractSocket13connectToHost.*|_ZN10QTcpSocket.*)@plt>' "$d" || true
            echo '===== SELECTED STRUCT-OFFSET ACCESSES ====='
            grep -E '\[[^]]+\+(0x20|0x30|0x38|0x48|0x50|0x54|0x70|0x74|0x78)\]' "$d" \
              | grep -Ei 'mov|cmp|test|lea' \
              | head -n 1200 || true
          } > "$out/index.txt"

          parser_callers="$(grep -E 'call[[:space:]]+e0fcf0([[:space:]]|<)' "$d" | sed -E 's/^[[:space:]]*([0-9a-f]+):.*/\1/' || true)"
          for a in $parser_callers; do
            start=$((0x$a - 0x500))
            stop=$((0x$a + 0x900))
            printf -v start_hex '0x%x' "$start"
            printf -v stop_hex '0x%x' "$stop"
            objdump -d -M intel --no-show-raw-insn \
              --start-address="$start_hex" --stop-address="$stop_hex" "$c" \
              > "$out/parser-caller-${a}.txt"
          done

          socket_callers="$(grep -E 'call[[:space:]].*<(.*connectToHost.*|_ZN15QAbstractSocket13connectToHost.*)@plt>' "$d" | sed -E 's/^[[:space:]]*([0-9a-f]+):.*/\1/' | head -n 30 || true)"
          for a in $socket_callers; do
            start=$((0x$a - 0x280))
            stop=$((0x$a + 0x380))
            printf -v start_hex '0x%x' "$start"
            printf -v stop_hex '0x%x' "$stop"
            objdump -d -M intel --no-show-raw-insn \
              --start-address="$start_hex" --stop-address="$stop_hex" "$c" \
              > "$out/socket-caller-${a}.txt"
          done

          strings -a -t x -n 4 "$c" \
            | grep -Ei 'protected.*world|unprotected.*world|useProtectedNetworkRoute|connect(ion|ing).*world|game server|world address|anti.?cheat|BattlEye' \
            | head -n 1000 > "$out/relevant-strings.txt" || true

          chmod -R a+rX "$out"
          SCRIPT

      - name: Copy trace report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-world-record-connection-trace"
          rm -rf "$out" && mkdir -p "$out"
          r="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/$r/report/world-record-connection-trace/." "$out/"

      - name: Upload trace report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-world-record-connection-trace
          path: ${{ runner.temp }}/tibia-world-record-connection-trace
          retention-days: 1
