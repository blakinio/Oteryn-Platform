name: Tibia Linux focused report recovery

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-focused-report-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Recover existing text-only analysis reports
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Stage selected persistent reports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache coreutils file findutils >/dev/null

          run_id=$(cat /analysis/latest-client-analysis-run-id)
          root=/analysis/client-analysis/${run_id}
          reports=${root}/report
          client=${root}/download/client
          out=${reports}/focused-report-recovery
          rm -rf "$out"
          mkdir -p "$out/reports"

          test "$(sha256sum "$client" | awk '{print $1}')" = "8b25d65ece158723dbb50a1b592c1ec8a3247a650fcd2d299bebdfd133cb5752"

          selected='actual-dual-metaobject
          auth-helper-flow
          connection-controller-route-slot
          connection-controller-slot12-final
          dual-connection-manager
          dual-metaobject
          dual-route-final
          focused-tcp-metacall
          gameserver-dual-connection-class
          gameserver-login-functions
          gameserver-route-accessors
          login-handler-fields-final
          parser-network-trace
          parser-vtable-transport
          playdata-gameserver-flow
          protected-route-policy-final
          protected-route-selection
          qlibrary-slices
          qt-gameserver-login
          route-branch-types
          runtime-route-consumer
          tcp-login-final
          tcp-qt-metaobject
          tcp-route-selector
          world-address-consumers
          world-enrichment
          world-record-connection-trace'

          printf '%s\n' "$selected" | sed 's/^[[:space:]]*//' | while IFS= read -r name; do
            [ -n "$name" ] || continue
            src=${reports}/${name}
            [ -d "$src" ] || { echo "missing required report directory: $name" >&2; exit 1; }
            mkdir -p "$out/reports/$name"
            find "$src" -type f -print0 | while IFS= read -r -d '' f; do
              mime=$(file -b --mime-type "$f")
              case "$mime" in
                text/*|application/json|application/xml|application/x-empty|inode/x-empty)
                  rel=${f#${src}/}
                  mkdir -p "$out/reports/$name/$(dirname "$rel")"
                  cp "$f" "$out/reports/$name/$rel"
                  ;;
                *)
                  echo "refusing non-text report: $f ($mime)" >&2
                  exit 1
                  ;;
              esac
            done
          done

          bytes=$(du -sb "$out/reports" | awk '{print $1}')
          files=$(find "$out/reports" -type f | wc -l)
          [ "$bytes" -le 20000000 ] || { echo "selected report set exceeds 20 MB: $bytes" >&2; exit 1; }

          {
            printf 'run_id\t%s\n' "$run_id"
            printf 'client_sha256\t%s\n' "$(sha256sum "$client" | awk '{print $1}')"
            printf 'report_bytes\t%s\n' "$bytes"
            printf 'report_files\t%s\n' "$files"
          } > "$out/manifest.tsv"

          find "$out/reports" -type f -printf '%P\t%s\n' | sort > "$out/files.tsv"
          chmod -R a+rX "$out"
          SCRIPT

      - name: Print recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              out=/analysis/client-analysis/${run_id}/report/focused-report-recovery
              cat "$out/manifest.tsv"
              cut -f1 "$out/files.tsv" | sed "s#/.*##" | sort | uniq -c
            '

      - name: Copy selected reports
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-linux-focused-reports"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/focused-report-recovery/." "$out/"

      - name: Upload selected reports
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-focused-reports
          path: ${{ runner.temp }}/tibia-linux-focused-reports
          retention-days: 1
