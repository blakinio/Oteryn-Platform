name: Tibia Linux BEClient findings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings:
    name: Print concise BEClient findings
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Read persisted BEClient analysis
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          report='/analysis/beclient-analysis/report'
          echo '===== SUMMARY ====='
          cat "${report}/summary.txt"
          echo '===== CONFIG HEX ====='
          od -An -tx1 -v "${report}/BEClient.cfg"
          echo '===== CONFIG TEXT ====='
          cat "${report}/BEClient.cfg" || true
          echo '===== DEPENDENCIES ====='
          cat "${report}/dependencies.txt"
          echo '===== EXPORTED FUNCTIONS ====='
          head -n 80 "${report}/exports.txt"
          echo '===== SELECTED STRINGS ====='
          head -n 120 "${report}/selected-strings.txt"
          SCRIPT
