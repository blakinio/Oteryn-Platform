name: Tibia Linux persisted transport report bundle

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-transport-report-bundle
  cancel-in-progress: true

jobs:
  export:
    name: Export persisted transport reports
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Copy selected text reports
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-linux-transport-reports"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for dir in \
            actual-dual-metaobject \
            direct-entry-vtable \
            dual-connection-manager \
            dual-route-final \
            entry-vtable \
            focused-tcp-metacall \
            gameserver-dual-connection-class \
            parser-network-trace \
            protected-route-selection \
            runtime-route-consumer \
            session-network-construction \
            tcp-qt-metaobject \
            tcp-route-selector \
            world-address-consumers \
            world-record-connection-trace; do
            mkdir -p "$out/$dir"
            docker cp "$cid:/analysis/client-analysis/${run_id}/report/$dir/." "$out/$dir/" 2>/dev/null || rmdir "$out/$dir" 2>/dev/null || true
          done
          find "$out" -type f -printf '%p %s bytes\n' | sort > "$out/manifest.txt"
          cat "$out/manifest.txt"

      - name: Upload transport reports
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-transport-reports
          path: ${{ runner.temp }}/tibia-linux-transport-reports
          retention-days: 1
