name: Tibia Linux connection route-slot findings

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-connection-route-slot-findings
  cancel-in-progress: true

jobs:
  report:
    name: Print persisted route-slot findings
    runs-on: oteryn-staging
    timeout-minutes: 7
    steps:
      - name: Print focused findings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -lc '
              set -eu
              run_id=$(cat /analysis/latest-client-analysis-run-id)
              report=/analysis/client-analysis/${run_id}/report/connection-controller-route-slot
              test -d "$report"

              echo "===== FILES ====="
              find "$report" -maxdepth 2 -type f -print | sort

              echo "===== CRITICAL VTABLE MAP ====="
              sed -n "/===== CRITICAL SLOTS =====/,$p" "$report/vtable-map.txt"

              echo "===== CONNECTION CONTROLLER HEADER ====="
              sed -n "/===== ConnectionController/,/===== GameserverGameSessionHighSlots/p" "$report/vtable-map.txt" | head -n 100

              echo "===== CRITICAL FOCUS ====="
              cat "$report/critical-focus.txt"

              echo "===== REFERENCED DATA ====="
              cat "$report/referenced-data.txt"

              echo "===== SLOT12 FUNCTION ====="
              for f in "$report"/functions/ConnectionController-slot12-*; do
                test -f "$f" || continue
                echo "FILE=$f"
                cat "$f"
              done
            '
