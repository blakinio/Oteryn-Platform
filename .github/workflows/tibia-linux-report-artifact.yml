name: Tibia Linux BattlEye integration inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory anti-cheat package and dynamic loading
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Inspect manifest and verified ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          apk add --no-cache binutils coreutils file jq >/dev/null

          analysis_run="$(cat /analysis/latest-client-analysis-run-id)"
          manifest_run="$(cat /analysis/latest-package-manifest-run-id)"
          client="/analysis/client-analysis/${analysis_run}/download/client"
          manifest="/analysis/package-manifests/${manifest_run}/package.json"

          echo "analysis_run=${analysis_run}"
          echo "manifest_run=${manifest_run}"
          echo '===== ANTI-CHEAT MANIFEST RECORDS ====='
          jq -c '.files[] | select((tojson | test("battleye|beclient|beservice|anti.?cheat"; "i")))' "${manifest}" || true
          echo '===== SHARED-LIBRARY RECORDS ====='
          jq -r '.files[] | select(.localfile | test("\\.so(\\.|$)")) | [.localfile,.url,.packedsize,.unpackedsize,(.executable // false)] | @tsv' "${manifest}" | sort
          echo '===== BE-NAMED FILE RECORDS ====='
          jq -r '.files[] | select((.localfile + " " + .url) | test("(^|/|\\b)(be|battleye|beclient|beservice)"; "i")) | [.localfile,.url,.packedsize,.unpackedsize,(.executable // false)] | @tsv' "${manifest}" | sort || true
          echo '===== DYNAMIC LOADER IMPORTS ====='
          readelf -Ws "${client}" | grep -Ei 'dlopen|dlsym|dlclose|dlerror|LoadLibrary|GetProcAddress|BEClient|BattlEye' || true
          echo '===== CLIENT SO / MODULE STRINGS ====='
          strings -a -n 4 "${client}" | grep -Ei '(^|/|\\b)[A-Za-z0-9._+-]*BE(Client)?[^ ]*\.so|lib[^ ]+\.so|dlopen|dlsym|BattlEye|BEClient' | sort -u | head -n 300 || true
          echo '===== ANTI-CHEAT STRINGS WITH OFFSETS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'BattlEye|BEClient|TAntiCheatController|useProtectedNetworkRoute|BattlEyeInitiallyActive|BattlEyeActivationTimestamp|availableBattlEyeTypes|initially_protected|anticheatprotection|externaladdressprotected|externaladdressunprotected|ProtectedWorldAddress|UnprotectedWorldAddress' | head -n 300 || true
          echo '===== CLIENT FILE ====='
          stat -c 'size=%s' "${client}"
          sha256sum "${client}"
          file "${client}"
          SCRIPT
