name: Tibia Linux locate actual GameserverDualConnection metaobject
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: oteryn-staging
    timeout-minutes: 10
    steps:
      - name: Locate and decode
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id=$(cat /analysis/latest-client-analysis-run-id)
          client=/analysis/client-analysis/${run_id}/download/client
          out=/analysis/client-analysis/${run_id}/report/actual-dual-metaobject
          rm -rf "$out" && mkdir -p "$out"
          python3 - "$client" "$out" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          binary,out=sys.argv[1:]; target='tibia::network::TGameserverDualConnection'
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              def v2o(v):
                  for s in secs:
                      a=int(s['sh_addr']);z=int(s['sh_size'])
                      if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
                  return None,None
              def o2v(o):
                  for s in secs:
                      a=int(s['sh_offset']);z=int(s['sh_size'])
                      if a<=o<a+z:return int(s['sh_addr'])+o-a,s.name
                  return None,None
              def u32(v):
                  o,_=v2o(v);return None if o is None or o+4>len(blob) else struct.unpack_from('<I',blob,o)[0]
              def rawq(v):
                  o,_=v2o(v);return None if o is None or o+8>len(blob) else struct.unpack_from('<Q',blob,o)[0]
              rels=[];resolved={}
              for s in secs:
                  if s['sh_type']!='SHT_RELA':continue
                  linked=elf.get_section(s['sh_link']) if s['sh_link'] else None
                  for r in s.iter_relocations():
                      slot=int(r['r_offset']);typ=int(r['r_info_type']);add=int(r['r_addend']) if r.is_RELA() else 0;val=None;sname=''
                      if typ==8:val=add
                      elif linked is not None and int(r['r_info_sym']):
                          sy=linked.get_symbol(int(r['r_info_sym']));sv=int(sy['st_value']);sname=sy.name
                          if sv:val=sv+add
                      if val is not None:resolved[slot]=val;rels.append((slot,val,typ,sname))
              def q(v):return resolved.get(v,rawq(v))
              occ=[];st=0;needle=target.encode()
              while True:
                  o=blob.find(needle,st)
                  if o<0:break
                  occ.append(o2v(o));st=o+1
              def decode(base):
                  first=u32(base)
                  if not first or first%8:return None
                  n=first//8
                  if not 1<=n<=4096:return None
                  arr=[]
                  for i in range(n):
                      rel=u32(base+i*8);ln=u32(base+i*8+4)
                      if rel is None or ln is None or ln>20000:return None
                      o,_=v2o(base+rel)
                      if o is None or o+ln>len(blob):return None
                      try:arr.append(blob[o:o+ln].decode('utf-8'))
                      except:return None
                  return arr
              candidates={}
              for va,sec in occ:
                  for base in range(max(0,va-0x20000)&~3,va+1,4):
                      arr=decode(base)
                      if arr and target in arr:candidates[base]=arr
              lines=[f'occurrences={occ}']
              ranges=[]
              for base,arr in sorted(candidates.items()):
                  lines.append(f'===== base=0x{base:x} count={len(arr)} =====')
                  for i,s in enumerate(arr):lines.append(f'string[{i}]={s!r}')
                  for slot,val,typ,sname in rels:
                      if val!=base:continue
                      lines.append(f'REF slot=0x{slot:x} type={typ} sym={sname!r}')
                      for d in range(-0x30,0x70,8):
                          a=slot+d;v=q(a);lines.append(f'  0x{a:x}: {None if v is None else hex(v)} section={None if v is None else v2o(v)[1]}')
                      md=q(slot+8);mc=q(slot+16)
                      if md:
                          h=[u32(md+i*4) for i in range(14)]
                          lines.append(f'MD=0x{md:x} header={h}')
                          if all(x is not None for x in h):
                              cnt,off,sig=h[4],h[5],h[13];lines.append(f'method_count={cnt} method_data={off} signal_count={sig}')
                              if 0<=cnt<=256:
                                  for i in range(cnt):
                                      e=[u32(md+(off+i*6+j)*4) for j in range(6)];ni=e[0];name=arr[ni] if ni<len(arr) else None
                                      lines.append(f'method[{i}] name={name!r} entry={e}')
                      if mc and v2o(mc)[1]=='.text':ranges.append(mc);lines.append(f'MC=0x{mc:x}')
              pathlib.Path(out,'located.txt').write_text('\n'.join(lines)+'\n')
              pathlib.Path(out,'metacalls.txt').write_text('\n'.join(f'{x:x}' for x in sorted(set(ranges)))+'\n')
          PY
          while read a; do [ -n "$a" ] && objdump -d -M intel --no-show-raw-insn --start-address=0x$a --stop-address=$((0x$a+0x5000)) "$client" > "$out/metacall-0x$a.txt"; done < "$out/metacalls.txt"
          chmod -R a+rX "$out"
          SCRIPT
      - name: Copy
        shell: bash
        run: |
          out=$RUNNER_TEMP/actual-dual-metaobject; rm -rf "$out"; mkdir -p "$out"
          run_id=$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)
          cid=$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/actual-dual-metaobject/." "$out/"
      - uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-actual-dual-metaobject
          path: ${{ runner.temp }}/actual-dual-metaobject
          retention-days: 1
