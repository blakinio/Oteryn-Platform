name: Tibia Linux exact BattlEye loader strings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Print exact loader and route selectors
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Read exact symbols and strings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          apk add --no-cache binutils >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"

          echo '===== LOADER IMPORTS ====='
          readelf -Ws "${client}" | grep -E 'UND (dlopen|dlsym|dlclose)@' || true
          echo '===== MODULE PATH / ABI STRINGS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'BEClient(_x64)?\.so|BattlEye/BEClient|BECLIENT_1\.0|GetVer|BEClient\.cfg' || true
          echo '===== ROUTE SELECTORS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'useProtectedNetworkRoute|ProtectedWorldAddress|UnprotectedWorldAddress|externaladdressprotected|externaladdressunprotected|externalportprotected|externalportunprotected' || true
          echo '===== ACTIVATION / SERVER FIELDS ====='
          strings -a -t x -n 4 "${client}" | grep -Ei 'BattlEyeInitiallyActive|BattlEyeActivationTimestamp|availableBattlEyeTypes|initially_protected|anticheatprotection|battleye|clienttype|sessionkey' | head -n 120 || true
          SCRIPT
