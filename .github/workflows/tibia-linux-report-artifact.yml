name: Tibia Linux compression probe report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Print persisted compression probe
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Read probe files from analysis volume
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          report="/analysis/client-analysis/${run_id}/report"
          download="/analysis/client-analysis/${run_id}/download"
          echo "run_id=${run_id}"
          echo '===== REPORT FILES ====='
          find "${report}" -maxdepth 1 -type f -exec stat -c '%s %n' {} \; | sort -n
          echo '===== PACKED HEADER ====='
          test ! -f "${report}/packed-header.txt" || cat "${report}/packed-header.txt"
          echo '===== GO FORMAT PROBE ====='
          test ! -f "${report}/go-format-probe.txt" || cat "${report}/go-format-probe.txt"
          echo '===== COMMAND PROBES ====='
          test ! -f "${report}/command-format-probes.txt" || cat "${report}/command-format-probes.txt"
          echo '===== DECODED CANDIDATES ====='
          test ! -f "${report}/decoded-candidates.txt" || cat "${report}/decoded-candidates.txt"
          echo '===== CANDIDATE FILES ====='
          find "${download}" -maxdepth 1 -type f -name 'decoded-*' -exec stat -c '%s %n' {} \; | sort -n || true
          SCRIPT
