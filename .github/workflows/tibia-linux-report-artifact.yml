name: Tibia Linux verification diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-report-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose downloaded Linux client files
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Compare persisted files with manifest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 sh -s <<'SCRIPT'
          set -eu
          apk add --no-cache coreutils file findutils jq xz >/dev/null

          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          root="/analysis/client-analysis/${run_id}"
          packed="${root}/download/client.lzma"
          client="${root}/download/client"
          report="${root}/report"
          manifest_run="$(cat /analysis/latest-package-manifest-run-id)"
          manifest="/analysis/package-manifests/${manifest_run}/package.json"
          record="$(jq -c '.files[] | select(.localfile == "bin/client")' "${manifest}")"

          echo "run_id=${run_id}"
          echo "manifest_run=${manifest_run}"
          echo "record=${record}"
          echo '===== ROOT TREE ====='
          find "${root}" -maxdepth 4 -type f -exec stat -c '%s %n' {} \; | sort -n
          echo '===== EXIT CODE ====='
          test ! -f "${report}/exit-code.txt" || cat "${report}/exit-code.txt"
          echo '===== PACKED ====='
          if test -f "${packed}"; then
            stat -c 'size=%s' "${packed}"
            sha256sum "${packed}"
            file "${packed}"
            xz --format=lzma --test "${packed}" && echo 'lzma_test=ok' || echo 'lzma_test=failed'
          else
            echo 'missing'
          fi
          echo '===== UNPACKED ====='
          if test -f "${client}"; then
            stat -c 'size=%s' "${client}"
            sha256sum "${client}"
            file "${client}"
          else
            echo 'missing'
          fi
          SCRIPT
