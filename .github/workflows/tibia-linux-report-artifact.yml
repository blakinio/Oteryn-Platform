name: Tibia Linux route branch type trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-route-branch-types
  cancel-in-progress: true

jobs:
  trace:
    name: Identify route branch helpers and object types
    runs-on: oteryn-staging
    timeout-minutes: 12
    steps:
      - name: Generate focused helper and RTTI report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null

          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/route-branch-types"
          rm -rf "${out}" && mkdir -p "${out}/functions"

          python3 - "${client}" "${out}" <<'PY'
          import pathlib, struct, sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          binary, out_dir = sys.argv[1:]
          helper_targets = [
              ('selectOrNormalizeGameserverRecord', 0x6fadb0),
              ('sessionMetaPopulateA', 0x6b8c80),
              ('sessionMetaPopulateB', 0x7525c0),
              ('protectedBranchPopulate', 0x6b8cd0),
          ]
          vptrs = [
              0x2f609e0, 0x2f609b8, 0x30762d0,
              0x2f60d28, 0x2f60cd8, 0x2f60d00,
              0x2f5ef20, 0x2f60d60,
          ]

          with open(binary, 'rb') as f:
              blob = f.read(); f.seek(0); elf = ELFFile(f); sections = list(elf.iter_sections())

              def va_to_offset(va):
                  for sec in sections:
                      start = int(sec['sh_addr']); size = int(sec['sh_size'])
                      if start <= va < start + size:
                          return int(sec['sh_offset']) + va - start, sec.name
                  return None, None

              resolved = {}
              for sec in sections:
                  if sec['sh_type'] != 'SHT_RELA':
                      continue
                  linked = elf.get_section(sec['sh_link']) if sec['sh_link'] else None
                  for rel in sec.iter_relocations():
                      slot = int(rel['r_offset']); typ = int(rel['r_info_type'])
                      addend = int(rel['r_addend']) if rel.is_RELA() else 0
                      value = None
                      if typ == 8:
                          value = addend
                      elif linked is not None and int(rel['r_info_sym']):
                          sym = linked.get_symbol(int(rel['r_info_sym']))
                          sym_value = int(sym['st_value'])
                          if sym_value:
                              value = sym_value + addend
                      if value is not None:
                          resolved[slot] = value

              def raw_qword(va):
                  off, _ = va_to_offset(va)
                  if off is None or off + 8 > len(blob): return None
                  return struct.unpack_from('<Q', blob, off)[0]

              def qword(va):
                  return resolved.get(va, raw_qword(va))

              def section_of(va):
                  return va_to_offset(va)[1]

              def cstring(va, limit=500):
                  off, sec = va_to_offset(va)
                  if off is None: return None, sec
                  end = blob.find(b'\0', off, min(len(blob), off + limit))
                  if end <= off: return None, sec
                  raw = blob[off:end]
                  try:
                      text = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      return None, sec
                  if text and sum(32 <= ord(ch) < 127 for ch in text) / len(text) < 0.9:
                      return None, sec
                  return text, sec

              fdes = []
              try:
                  dwarf = elf.get_dwarf_info()
                  for entry in dwarf.EH_CFI_entries():
                      if isinstance(entry, FDE):
                          start = int(entry['initial_location'])
                          fdes.append((start, start + int(entry['address_range'])))
              except Exception:
                  pass

              def function_range(address):
                  for start, end in fdes:
                      if start <= address < end:
                          return start, end
                  return address, address + 0x5000

              ranges = []
              for name, address in helper_targets:
                  start, end = function_range(address)
                  ranges.append((name, address, start, end))
              pathlib.Path(out_dir, 'ranges.tsv').write_text(
                  ''.join(f'{name}\t{address:x}\t{start:x}\t{end:x}\n' for name, address, start, end in ranges)
              )

              lines = []
              for vptr in vptrs:
                  lines.append(f'===== VPTR 0x{vptr:x} =====')
                  lines.append(f'vptr_section={section_of(vptr)}')
                  offset_to_top = qword(vptr - 16)
                  typeinfo = qword(vptr - 8)
                  lines.append(f'offset_to_top_raw={None if offset_to_top is None else hex(offset_to_top)}')
                  lines.append(f'typeinfo={None if typeinfo is None else hex(typeinfo)} section={None if typeinfo is None else section_of(typeinfo)}')
                  if typeinfo:
                      typeinfo_vptr = qword(typeinfo)
                      name_ptr = qword(typeinfo + 8)
                      name, name_sec = cstring(name_ptr) if name_ptr else (None, None)
                      lines.append(f'typeinfo_vptr={None if typeinfo_vptr is None else hex(typeinfo_vptr)} section={None if typeinfo_vptr is None else section_of(typeinfo_vptr)}')
                      lines.append(f'typeinfo_name_ptr={None if name_ptr is None else hex(name_ptr)} section={name_sec} name={name!r}')
                  for index in range(16):
                      target = qword(vptr + index * 8)
                      lines.append(f'slot={index} slot_va=0x{vptr + index*8:x} target={None if target is None else hex(target)} section={None if target is None else section_of(target)}')
                  lines.append('')
              pathlib.Path(out_dir, 'rtti-vtables.txt').write_text('\n'.join(lines) + '\n')
          PY

          while IFS="$(printf '\t')" read -r name address start end; do
            [ -n "${address}" ] || continue
            max_end=$((0x${start} + 0xc000))
            actual_end=$((0x${end}))
            if [ "${actual_end}" -gt "${max_end}" ]; then actual_end="${max_end}"; fi
            stop_hex="$(printf '0x%x' "${actual_end}")"
            objdump -d -M intel --no-show-raw-insn \
              --start-address="0x${start}" --stop-address="${stop_hex}" "${client}" \
              > "${out}/functions/${name}.txt"
          done < "${out}/ranges.tsv"

          objdump -d -M intel --no-show-raw-insn \
            --start-address=0x6fdbd0 --stop-address=0x6fea20 "${client}" \
            > "${out}/route-branch.txt"

          {
            echo '===== FUNCTION RANGES ====='
            cat "${out}/ranges.tsv"
            echo '===== HELPER CALLS AND BYTE TESTS ====='
            for f in "${out}"/functions/*.txt; do
              echo "--- $(basename "$f") ---"
              grep -E '(call|cmp|test|cmov|sete|setne|movzx).*' "$f" | head -n 1200 || true
            done
            echo '===== ROUTE BRANCH KEY LINES ====='
            grep -n -B 14 -A 30 -E '(6fe4fb|6fe7e1|rsp\+0x348|rsp\+0x349|rsp\+0x34a|r12\+0x1e8|r12\+0x1ea|2f609e0|2f609b8|2f60d28|2f60cd8|2f60d00)' "${out}/route-branch.txt" || true
          } > "${out}/focus.txt"

          python3 - "${client}" "${out}/route-branch.txt" "${out}"/functions/*.txt > "${out}/referenced-data.txt" <<'PY'
          import re, sys
          from elftools.elf.elffile import ELFFile
          binary, *inputs = sys.argv[1:]
          addresses = set()
          for path in inputs:
              text = open(path, encoding='utf-8', errors='replace').read()
              addresses.update(int(x, 16) for x in re.findall(r'#\s*([0-9a-fA-F]+)', text))
          with open(binary, 'rb') as f:
              blob = f.read(); f.seek(0); elf = ELFFile(f); sections = list(elf.iter_sections())
          def va_to_offset(va):
              for sec in sections:
                  start = int(sec['sh_addr']); size = int(sec['sh_size'])
                  if start <= va < start + size:
                      return int(sec['sh_offset']) + va - start, sec.name
              return None, None
          for va in sorted(addresses):
              off, sec = va_to_offset(va)
              if off is None: continue
              end = blob.find(b'\0', off, min(len(blob), off + 700))
              value = None
              if end > off:
                  raw = blob[off:end]
                  if raw and sum(32 <= b < 127 or b in (9,10,13) for b in raw) / len(raw) > 0.9:
                      value = raw.decode('utf-8', errors='replace')
              print(f'va=0x{va:x} section={sec} string={value!r}')
          PY

          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy route branch report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-route-branch-types"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/route-branch-types/." "${out}/"

      - name: Upload route branch report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-route-branch-types
          path: ${{ runner.temp }}/tibia-route-branch-types
          retention-days: 1
