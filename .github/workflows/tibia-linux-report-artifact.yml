name: Tibia Linux callback report recovery

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: oteryn-staging
    timeout-minutes: 5
    steps:
      - name: Verify and copy text report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/be-callback-semantics-v3"
          rm -rf "$out" && mkdir -p "$out"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/analysis/client-analysis/${run_id}/report/be-callback-semantics-v3/." "$out/"
          test -s "$out/summary.txt"
          cat "$out/summary.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: be-callback-semantics-v3-recovered
          path: ${{ runner.temp }}/be-callback-semantics-v3
          retention-days: 1
