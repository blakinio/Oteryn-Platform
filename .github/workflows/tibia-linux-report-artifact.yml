name: Tibia Linux dual-connection manager trace

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tibia-linux-report-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-dual-connection-manager
  cancel-in-progress: true

jobs:
  trace:
    name: Decode manager vtable and route-selection methods
    runs-on: oteryn-staging
    timeout-minutes: 15
    steps:
      - name: Generate manager report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            python:3.12-alpine sh -s <<'SCRIPT'
          set -euo pipefail
          apk add --no-cache binutils coreutils grep >/dev/null
          pip install --no-cache-dir pyelftools==0.32 >/dev/null
          run_id="$(cat /analysis/latest-client-analysis-run-id)"
          client="/analysis/client-analysis/${run_id}/download/client"
          out="/analysis/client-analysis/${run_id}/report/dual-connection-manager"
          rm -rf "${out}" && mkdir -p "${out}/functions"

          objdump -d -M intel --no-show-raw-insn --start-address=0xb53000 --stop-address=0xb57000 "${client}" > "${out}/manager-constructor-window.txt"
          objdump -d -M intel --no-show-raw-insn --start-address=0x196e000 --stop-address=0x196f500 "${client}" > "${out}/session-network-construction-window.txt"

          python3 - "${client}" "${out}" <<'PY'
          import pathlib,struct,sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          binary,out=sys.argv[1:]
          VPTR=0x304a5e0
          CTOR=0xb53d60
          with open(binary,'rb') as f:
              blob=f.read(); f.seek(0); elf=ELFFile(f); secs=list(elf.iter_sections())
              def v2o(v):
                  for s in secs:
                      a=int(s['sh_addr']); z=int(s['sh_size'])
                      if a<=v<a+z:return int(s['sh_offset'])+v-a,s.name
                  return None,None
              def o2v(o):
                  for s in secs:
                      a=int(s['sh_offset']); z=int(s['sh_size'])
                      if a<=o<a+z:return int(s['sh_addr'])+o-a,s.name
                  return None,None
              def rawq(v):
                  o,_=v2o(v); return None if o is None or o+8>len(blob) else struct.unpack_from('<Q',blob,o)[0]
              resolved={}
              for s in secs:
                  if s['sh_type']!='SHT_RELA':continue
                  linked=elf.get_section(s['sh_link']) if s['sh_link'] else None
                  for rel in s.iter_relocations():
                      slot=int(rel['r_offset']); typ=int(rel['r_info_type']); add=int(rel['r_addend']) if rel.is_RELA() else 0; val=None
                      if typ==8: val=add
                      elif linked is not None and int(rel['r_info_sym']):
                          sy=linked.get_symbol(int(rel['r_info_sym'])); sv=int(sy['st_value'])
                          if sv: val=sv+add
                      if val is not None: resolved[slot]=val
              def q(v):return resolved.get(v,rawq(v))
              def cstr(v,limit=800):
                  o,sec=v2o(v)
                  if o is None:return None,sec
                  e=blob.find(b'\0',o,min(len(blob),o+limit))
                  if e<=o:return None,sec
                  try:return blob[o:e].decode('utf-8'),sec
                  except:return None,sec
              fdes=[]
              try:
                  for e in elf.get_dwarf_info().EH_CFI_entries():
                      if isinstance(e,FDE):
                          s=int(e['initial_location']);fdes.append((s,s+int(e['address_range'])))
              except Exception:pass
              def frange(a):
                  m=[x for x in fdes if x[0]<=a<x[1]]
                  return min(m,key=lambda x:x[1]-x[0]) if m else (a,a+0x10000)

              lines=[]; rows=[]; seen=set()
              lines.append(f'VPTR=0x{VPTR:x}')
              lines.append(f'offset_to_top={q(VPTR-16)!r}')
              ti=q(VPTR-8); lines.append(f'typeinfo={None if ti is None else hex(ti)} section={None if ti is None else v2o(ti)[1]}')
              if ti:
                  np=q(ti+8); n,sec=cstr(np) if np else (None,None)
                  lines.append(f'typeinfo_name_ptr={None if np is None else hex(np)} section={sec} name={n!r}')
              for i in range(0,80):
                  target=q(VPTR+i*8); sec=None if target is None else v2o(target)[1]
                  lines.append(f'slot={i} offset=0x{i*8:x} target={None if target is None else hex(target)} section={sec}')
                  if target and sec=='.text' and target not in seen:
                      s,e=frange(target); rows.append((f'slot{i}',target,s,e));seen.add(target)
              s,e=frange(CTOR); rows.append(('constructor',CTOR,s,e))
              pathlib.Path(out,'vtable-map.txt').write_text('\n'.join(lines)+'\n')
              pathlib.Path(out,'ranges.tsv').write_text(''.join(f'{n}\t{a:x}\t{s:x}\t{e:x}\n' for n,a,s,e in rows))

              # Binary references to vptr/typeinfo/ctor for constructor and consumer discovery.
              refs=[]
              for value,label in [(VPTR,'vptr'),(ti,'typeinfo') if ti else (0,'none'),(CTOR,'ctor')]:
                  if not value:continue
                  needle=struct.pack('<Q',value); start=0
                  while True:
                      o=blob.find(needle,start)
                      if o<0:break
                      va,sec=o2v(o);refs.append((label,value,va,sec));start=o+1
              pathlib.Path(out,'raw-references.txt').write_text(''.join(f'{l}\t0x{v:x}\t0x{a:x}\t{s}\n' for l,v,a,s in refs))
          PY

          while IFS="$(printf '\t')" read -r name address start end; do
            actual_end=$((0x${end})); max_end=$((0x${start}+0x20000)); [ "${actual_end}" -le "${max_end}" ] || actual_end="${max_end}"
            objdump -d -M intel --no-show-raw-insn --start-address="0x${start}" --stop-address="$(printf '0x%x' "${actual_end}")" "${client}" > "${out}/functions/${name}-0x${address}.txt"
          done < "${out}/ranges.tsv"

          # Full xrefs in disassembly only for the few known addresses.
          objdump -d -M intel --no-show-raw-insn "${client}" | grep -n -B 35 -A 70 -E '(304a5e0|b53d60|call[[:space:]]+b53d60)' > "${out}/code-xrefs.txt" || true
          grep -RniE 'QTcpSocket|QAbstractSocket|QHostAddress|QUrl|connectToHost|disconnectFromHost|QIODevice|write|read|0xbc0|0xbd8|0xbdc|0xbe0|0xbf8|0xbfa|0x1a0|0x1b8|0x1bc|0x1c0|0x1d8|0x1da|cmp|test|cmov|sete|setne|call[[:space:]]' "${out}/functions" > "${out}/focused-index.txt" || true
          chmod -R a+rX "${out}"
          SCRIPT

      - name: Copy manager report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tibia-dual-connection-manager"
          rm -rf "${out}" && mkdir -p "${out}"
          run_id="$(docker run --rm --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 cat /analysis/latest-client-analysis-run-id)"
          cid="$(docker create --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' alpine:3.22 true)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/analysis/client-analysis/${run_id}/report/dual-connection-manager/." "${out}/"

      - name: Upload manager report
        uses: actions/upload-artifact@v4
        with:
          name: tibia-linux-dual-connection-manager
          path: ${{ runner.temp }}/tibia-dual-connection-manager
          retention-days: 1
