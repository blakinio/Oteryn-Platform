name: Tibia Linux volume report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-volume-report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Read Tibia analysis volume
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Print latest persisted result
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              run_id="$(cat /analysis/latest-run-id)"
              report_dir="/analysis/runs/${run_id}/report"
              home_dir="/analysis/runs/${run_id}/home"
              echo "run_id=${run_id}"
              echo "===== EXIT ====="
              cat "${report_dir}/container-exit-code.txt"
              echo "===== ANALYSIS ====="
              cat "${report_dir}/analysis-report.txt"
              echo "===== LAUNCHER LOG ====="
              find "${home_dir}" -type f -name tibia-launcher.log -exec cat {} \;
              echo "===== STDERR ====="
              test ! -f "${report_dir}/launcher-stderr.log" || tail -n 100 "${report_dir}/launcher-stderr.log"
              echo "===== METADATA ====="
              cat "${report_dir}/metadata-files.txt"
              echo "===== LARGEST FILES ====="
              tail -n 80 "${report_dir}/installed-files.tsv"
            '
