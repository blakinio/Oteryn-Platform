name: Tibia Linux volume report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-volume-report.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-runner-analysis
  cancel-in-progress: true

jobs:
  report:
    name: Read Tibia analysis volume
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Print latest persisted report
        shell: bash
        run: |
          set -euo pipefail
          docker volume inspect oteryn-tibia-linux-analysis >/dev/null
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              run_id="$(cat /analysis/latest-run-id 2>/dev/null || true)"
              echo "run_id=${run_id}"
              test -n "${run_id}"
              report_dir="/analysis/runs/${run_id}/report"
              echo "===== CONTAINER EXIT ====="
              test ! -f "${report_dir}/container-exit-code.txt" || cat "${report_dir}/container-exit-code.txt"
              echo "===== ANALYSIS REPORT ====="
              test ! -f "${report_dir}/analysis-report.txt" || cat "${report_dir}/analysis-report.txt"
              echo "===== LAUNCHER SUMMARY ====="
              test ! -f "${report_dir}/launcher-summary.txt" || cat "${report_dir}/launcher-summary.txt"
              echo "===== METADATA FILES ====="
              test ! -f "${report_dir}/metadata-files.txt" || cat "${report_dir}/metadata-files.txt"
              echo "===== DOWNLOAD ERROR ====="
              test ! -s "${report_dir}/download-error.log" || cat "${report_dir}/download-error.log"
              echo "===== LAUNCHER STDERR ====="
              test ! -f "${report_dir}/launcher-stderr.log" || tail -n 120 "${report_dir}/launcher-stderr.log"
              echo "===== LAUNCHER STDOUT ====="
              test ! -f "${report_dir}/launcher-stdout.log" || tail -n 120 "${report_dir}/launcher-stdout.log"
              echo "===== APT LOG TAIL ====="
              test ! -f "${report_dir}/apt.log" || tail -n 30 "${report_dir}/apt.log"
              echo "===== INSTALLED FILES, LARGEST ====="
              test ! -f "${report_dir}/installed-files.tsv" || tail -n 100 "${report_dir}/installed-files.tsv"
            '
