name: Tibia Linux volume report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-volume-report
  cancel-in-progress: true

jobs:
  report:
    name: Read Tibia analysis volume
    runs-on: oteryn-staging
    timeout-minutes: 5

    steps:
      - name: Print concise persisted report
        shell: bash
        run: |
          set -euo pipefail
          docker volume inspect oteryn-tibia-linux-analysis >/dev/null
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              echo "===== ANALYSIS RUNS ====="
              find /analysis/runs -mindepth 1 -maxdepth 1 -type d -printf "%f\n" 2>/dev/null | sort || true
              echo
              echo "===== LATEST RUN ID ====="
              test ! -f /analysis/latest-run-id || cat /analysis/latest-run-id
            '
