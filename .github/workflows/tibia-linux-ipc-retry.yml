name: Tibia Linux isolated launcher retry

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-ipc-retry.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-ipc-retry
  cancel-in-progress: true

jobs:
  retry:
    name: Run launcher with private IPC
    runs-on: oteryn-staging
    timeout-minutes: 25

    steps:
      - name: Launch from persisted official archive
        shell: bash
        run: |
          set -euo pipefail
          readonly analysis_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f tibia-linux-ipc-retry >/dev/null 2>&1 || true

          docker run --rm \
            --name tibia-linux-ipc-retry \
            --hostname "tibia-${GITHUB_RUN_ID}" \
            --ipc private \
            --tmpfs '/tmp:rw,nosuid,nodev,mode=1777,size=256m' \
            --tmpfs '/dev/shm:rw,nosuid,nodev,noexec,mode=1777,size=256m' \
            --network bridge \
            --env "ANALYSIS_RUN_ID=${analysis_run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              readonly source_run=30225566972-1
              readonly source_launcher="/analysis/runs/${source_run}/download/Tibia"
              readonly run_root="/analysis/runs/${ANALYSIS_RUN_ID}"
              readonly home_dir="${run_root}/home"
              readonly report_dir="${run_root}/report"
              readonly launcher_dir="${run_root}/download/Tibia"
              mkdir -p "${home_dir}" "${report_dir}" "${run_root}/download" "${run_root}/runtime"
              chmod 700 "${run_root}/runtime"
              printf "%s\n" "${ANALYSIS_RUN_ID}" > /analysis/latest-run-id

              on_exit() {
                status=$?
                printf "%s\n" "${status}" > "${report_dir}/container-exit-code.txt"
              }
              trap on_exit EXIT

              test -x "${source_launcher}/Tibia"
              cp -a "${source_launcher}" "${run_root}/download/"

              apt-get update -qq > "${report_dir}/apt.log" 2>&1
              apt-get install -y -qq --no-install-recommends \
                bash binutils ca-certificates coreutils dbus-x11 file findutils \
                fonts-dejavu-core grep libasound2t64 libdbus-1-3 libegl1 \
                libfontconfig1 libfreetype6 libgbm1 libgl1 libglx0 libnss3 \
                libopengl0 libpulse0 libx11-6 libx11-xcb1 libxcb-cursor0 \
                libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
                libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
                libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxi6 \
                libxkbcommon-x11-0 libxrandr2 libxrender1 libxtst6 procps sed \
                util-linux xauth xvfb \
                >> "${report_dir}/apt.log" 2>&1

              cd "${launcher_dir}"
              set +e
              HOME="${home_dir}" \
              XDG_DATA_HOME="${home_dir}/.local/share" \
              XDG_CONFIG_HOME="${home_dir}/.config" \
              XDG_RUNTIME_DIR="${run_root}/runtime" \
              TMPDIR=/tmp \
              LIBGL_ALWAYS_SOFTWARE=1 \
              QT_XCB_GL_INTEGRATION=none \
              dbus-run-session -- \
                xvfb-run -a -s "-screen 0 1280x800x24" \
                ./Tibia \
                > "${report_dir}/launcher-stdout.log" \
                2> "${report_dir}/launcher-stderr.log" &
              launcher_pid=$!
              set -e

              client_path=""
              for _ in $(seq 1 60); do
                client_path="$(find "${home_dir}" -type f -path "*/packages/*/bin/client" -perm -111 -print -quit 2>/dev/null || true)"
                if [ -n "${client_path}" ]; then
                  sleep 30
                  break
                fi
                if ! kill -0 "${launcher_pid}" 2>/dev/null; then
                  break
                fi
                sleep 10
              done

              if kill -0 "${launcher_pid}" 2>/dev/null; then
                kill "${launcher_pid}" 2>/dev/null || true
                sleep 3
                kill -9 "${launcher_pid}" 2>/dev/null || true
              fi
              wait "${launcher_pid}" 2>/dev/null || true

              find "${home_dir}" -type f -printf "%s\t%p\n" | sort -n > "${report_dir}/installed-files.tsv"
              find "${home_dir}" -type f \( -name package.json -o -name assets.json \) -print > "${report_dir}/metadata-files.txt"
              client_path="$(find "${home_dir}" -type f -path "*/packages/*/bin/client" -perm -111 -print -quit 2>/dev/null || true)"

              {
                printf "analysis_run_id=%s\n" "${ANALYSIS_RUN_ID}"
                if [ -n "${client_path}" ]; then
                  printf "game_client_found=yes\n"
                  printf "game_client_path=%s\n" "${client_path}"
                  printf "game_client_size=%s\n" "$(stat -c %s "${client_path}")"
                  printf "game_client_sha256=%s\n" "$(sha256sum "${client_path}" | cut -d " " -f1)"
                  file "${client_path}"
                  printf "\n[Dynamic dependencies]\n"
                  readelf -d "${client_path}" | grep -E "NEEDED|RPATH|RUNPATH" || true
                  printf "\n[Selected indicators]\n"
                  strings -a -n 5 "${client_path}" \
                    | grep -Ei "battleye|beclient|beservice|protected|unprotected|loginservice|sessionkey|clienttype|clientversion|assetversion|two.?factor|loginconfirmation|trusteddevice|devicecookie|masslogin|--battleye" \
                    | sort -u | head -n 1000 || true
                else
                  printf "game_client_found=no\n"
                fi
              } > "${report_dir}/analysis-report.txt"

              chmod -R a+rX "${run_root}"
            '

      - name: Print concise result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          readonly analysis_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm \
            --env "ANALYSIS_RUN_ID=${analysis_run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              report_dir="/analysis/runs/${ANALYSIS_RUN_ID}/report"
              echo "===== EXIT ====="
              cat "${report_dir}/container-exit-code.txt"
              echo "===== ANALYSIS ====="
              cat "${report_dir}/analysis-report.txt"
              echo "===== LAUNCHER APP LOG ====="
              find "/analysis/runs/${ANALYSIS_RUN_ID}/home" -type f -name tibia-launcher.log -exec cat {} \;
              echo "===== STDERR ====="
              test ! -f "${report_dir}/launcher-stderr.log" || tail -n 100 "${report_dir}/launcher-stderr.log"
              echo "===== METADATA ====="
              cat "${report_dir}/metadata-files.txt"
              echo "===== LARGEST FILES ====="
              tail -n 80 "${report_dir}/installed-files.tsv"
            '
