name: Tibia Linux package analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-runner-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-runner-analysis
  cancel-in-progress: true

jobs:
  install-and-analyze:
    name: Install and analyze on Synology
    runs-on: oteryn-staging
    timeout-minutes: 45

    steps:
      - name: Verify isolated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Docker={{.ServerVersion}} Architecture={{.Architecture}} OS={{.OperatingSystem}}'

      - name: Initialize dedicated Docker volume
        shell: bash
        run: |
          set -euo pipefail
          docker volume inspect oteryn-tibia-linux-analysis >/dev/null 2>&1 || \
            docker volume create oteryn-tibia-linux-analysis

      - name: Download, install and statically analyze Linux client
        shell: bash
        run: |
          set -euo pipefail
          readonly analysis_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f tibia-linux-runner-analysis >/dev/null 2>&1 || true

          docker run --rm \
            --name tibia-linux-runner-analysis \
            --network bridge \
            --env "ANALYSIS_RUN_ID=${analysis_run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              readonly run_root="/analysis/runs/${ANALYSIS_RUN_ID}"
              readonly download_dir="${run_root}/download"
              readonly home_dir="${run_root}/home"
              readonly report_dir="${run_root}/report"
              mkdir -p "${download_dir}" "${home_dir}" "${report_dir}"
              printf "%s\n" "${ANALYSIS_RUN_ID}" > /analysis/latest-run-id

              on_exit() {
                status=$?
                printf "%s\n" "${status}" > "${report_dir}/container-exit-code.txt"
              }
              trap on_exit EXIT

              apt-get update -qq > "${report_dir}/apt.log" 2>&1
              apt-get install -y -qq --no-install-recommends \
                bash \
                binutils \
                ca-certificates \
                coreutils \
                curl \
                dbus-x11 \
                file \
                findutils \
                fonts-dejavu-core \
                grep \
                libasound2t64 \
                libdbus-1-3 \
                libegl1 \
                libfontconfig1 \
                libfreetype6 \
                libgbm1 \
                libgl1 \
                libglx0 \
                libnss3 \
                libopengl0 \
                libpulse0 \
                libx11-6 \
                libx11-xcb1 \
                libxcb-cursor0 \
                libxcb-glx0 \
                libxcb-icccm4 \
                libxcb-image0 \
                libxcb-keysyms1 \
                libxcb-randr0 \
                libxcb-render-util0 \
                libxcb-render0 \
                libxcb-shape0 \
                libxcb-shm0 \
                libxcb-sync1 \
                libxcb-util1 \
                libxcb-xfixes0 \
                libxcb-xinerama0 \
                libxcb-xkb1 \
                libxcomposite1 \
                libxdamage1 \
                libxi6 \
                libxkbcommon-x11-0 \
                libxrandr2 \
                libxrender1 \
                libxtst6 \
                procps \
                sed \
                tar \
                util-linux \
                xauth \
                xvfb \
                >> "${report_dir}/apt.log" 2>&1

              readonly archive="${download_dir}/tibia.x64.tar.gz"
              readonly source_url=https://static.tibia.com/download/tibia.x64.tar.gz

              curl --fail --location --silent --show-error \
                --retry 5 --retry-delay 3 --connect-timeout 30 \
                --output "${archive}" \
                "${source_url}" \
                2> "${report_dir}/download-error.log"

              sha256sum "${archive}" > "${report_dir}/launcher-archive.sha256"
              tar -tzf "${archive}" > "${report_dir}/launcher-archive-files.txt"
              tar -xzf "${archive}" -C "${download_dir}"

              readonly launcher_dir="${download_dir}/Tibia"
              readonly launcher="${launcher_dir}/Tibia"
              test -x "${launcher}"

              {
                printf "source_url=%s\n" "${source_url}"
                printf "analysis_utc=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                printf "container_arch=%s\n" "$(uname -m)"
                file "${launcher}"
                sha256sum "${launcher}"
              } > "${report_dir}/launcher-summary.txt"

              cd "${launcher_dir}"
              set +e
              HOME="${home_dir}" \
              XDG_DATA_HOME="${home_dir}/.local/share" \
              XDG_CONFIG_HOME="${home_dir}/.config" \
              LIBGL_ALWAYS_SOFTWARE=1 \
              QT_XCB_GL_INTEGRATION=none \
              dbus-run-session -- \
                xvfb-run -a -s "-screen 0 1280x800x24" \
                ./Tibia \
                > "${report_dir}/launcher-stdout.log" \
                2> "${report_dir}/launcher-stderr.log" &
              launcher_pid=$!
              set -e

              client_path=""
              for _ in $(seq 1 90); do
                client_path="$(find "${home_dir}" -type f -path "*/packages/*/bin/client" -perm -111 -print -quit 2>/dev/null || true)"
                if [ -n "${client_path}" ]; then
                  sleep 30
                  break
                fi
                if ! kill -0 "${launcher_pid}" 2>/dev/null; then
                  break
                fi
                sleep 10
              done

              if kill -0 "${launcher_pid}" 2>/dev/null; then
                kill "${launcher_pid}" 2>/dev/null || true
                sleep 3
                kill -9 "${launcher_pid}" 2>/dev/null || true
              fi
              wait "${launcher_pid}" 2>/dev/null || true

              find "${home_dir}" -type f -printf "%s\t%p\n" \
                | sort -n \
                > "${report_dir}/installed-files.tsv"

              find "${home_dir}" -type f \
                \( -name package.json -o -name assets.json -o -name tibiametadata.json \) \
                -print \
                > "${report_dir}/metadata-files.txt"

              client_path="$(find "${home_dir}" -type f -path "*/packages/*/bin/client" -perm -111 -print -quit 2>/dev/null || true)"

              {
                printf "analysis_run_id=%s\n" "${ANALYSIS_RUN_ID}"
                printf "analysis_utc=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                printf "storage=docker-volume:oteryn-tibia-linux-analysis\n"
                printf "launcher_archive_sha256=%s\n" "$(cut -d " " -f1 "${report_dir}/launcher-archive.sha256")"

                if [ -z "${client_path}" ]; then
                  printf "game_client_found=no\n"
                  printf "result=Launcher did not install a separate packages/*/bin/client during this run.\n"
                else
                  printf "game_client_found=yes\n"
                  printf "game_client_path=%s\n" "${client_path}"
                  printf "game_client_size=%s\n" "$(stat -c %s "${client_path}")"
                  printf "game_client_sha256=%s\n" "$(sha256sum "${client_path}" | cut -d " " -f1)"
                  printf "game_client_file="
                  file -b "${client_path}"

                  printf "\n[ELF header]\n"
                  readelf -h "${client_path}" || true

                  printf "\n[Dynamic dependencies]\n"
                  readelf -d "${client_path}" | grep -E "NEEDED|RPATH|RUNPATH" || true

                  printf "\n[Selected indicators]\n"
                  strings -a -n 5 "${client_path}" \
                    | grep -Ei "battleye|beclient|beservice|protected|unprotected|loginservice|sessionkey|clienttype|clientversion|assetversion|two.?factor|loginconfirmation|trusteddevice|devicecookie|masslogin|--battleye" \
                    | sort -u \
                    | head -n 1000 \
                    || true
                fi
              } > "${report_dir}/analysis-report.txt"

              chmod -R a+rX "${run_root}"
            '

      - name: Print concise text-only analysis report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          readonly analysis_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm \
            --env "ANALYSIS_RUN_ID=${analysis_run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              report_dir="/analysis/runs/${ANALYSIS_RUN_ID}/report"
              echo "===== CONTAINER EXIT ====="
              test ! -f "${report_dir}/container-exit-code.txt" || cat "${report_dir}/container-exit-code.txt"
              echo
              echo "===== ANALYSIS REPORT ====="
              test ! -f "${report_dir}/analysis-report.txt" || cat "${report_dir}/analysis-report.txt"
              echo
              echo "===== LAUNCHER SUMMARY ====="
              test ! -f "${report_dir}/launcher-summary.txt" || cat "${report_dir}/launcher-summary.txt"
              echo
              echo "===== METADATA FILES ====="
              test ! -f "${report_dir}/metadata-files.txt" || cat "${report_dir}/metadata-files.txt"
              echo
              echo "===== DOWNLOAD ERROR ====="
              test ! -s "${report_dir}/download-error.log" || cat "${report_dir}/download-error.log"
              echo
              echo "===== LAUNCHER STDERR ====="
              test ! -f "${report_dir}/launcher-stderr.log" || tail -n 120 "${report_dir}/launcher-stderr.log"
              echo
              echo "===== LAUNCHER STDOUT ====="
              test ! -f "${report_dir}/launcher-stdout.log" || tail -n 120 "${report_dir}/launcher-stdout.log"
              echo
              echo "===== APT LOG TAIL ====="
              test ! -f "${report_dir}/apt.log" || tail -n 40 "${report_dir}/apt.log"
              echo
              echo "===== INSTALLED FILES, LARGEST ====="
              test ! -f "${report_dir}/installed-files.tsv" || tail -n 80 "${report_dir}/installed-files.tsv"
            '
