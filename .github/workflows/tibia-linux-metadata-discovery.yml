name: Tibia Linux metadata discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-metadata-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibia-linux-ipc-retry
  cancel-in-progress: true

jobs:
  discover:
    name: Resolve current Linux client package
    runs-on: oteryn-staging
    timeout-minutes: 10

    steps:
      - name: Fetch and inspect launcher metadata
        shell: bash
        run: |
          set -euo pipefail
          readonly run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume inspect oteryn-tibia-linux-analysis >/dev/null 2>&1 || \
            docker volume create oteryn-tibia-linux-analysis

          docker run --rm \
            --network bridge \
            --env "RUN_ID=${run_id}" \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis' \
            alpine:3.22 \
            sh -lc '
              set -eu
              apk add --no-cache ca-certificates curl jq >/dev/null

              root="/analysis/metadata/${RUN_ID}"
              mkdir -p "${root}"
              url="https://static.tibia.com/launcher/tibiametadata.json"

              curl --fail --location --silent --show-error --compressed \
                --referer "${url}" \
                --retry 5 --retry-delay 2 \
                --output "${root}/tibiametadata.json" \
                "${url}"

              printf "%s\n" "${RUN_ID}" > /analysis/latest-metadata-run-id
              sha256sum "${root}/tibiametadata.json" > "${root}/tibiametadata.sha256"

              echo "===== METADATA SUMMARY ====="
              wc -c "${root}/tibiametadata.json"
              cat "${root}/tibiametadata.sha256"
              echo
              echo "===== ROOT KEYS ====="
              jq -r "if type == \"object\" then keys[] else type end" "${root}/tibiametadata.json"
              echo
              echo "===== URL VALUES ====="
              jq -r ".. | strings | select(test(\"^https?://\"))" "${root}/tibiametadata.json" \
                | sort -u \
                | tee "${root}/urls.txt"
              echo
              echo "===== LINUX / CLIENT / PACKAGE OBJECTS ====="
              jq -c ".. | objects | select((tojson | test(\"linux|x64|client|package|current\"; \"i\")))" \
                "${root}/tibiametadata.json" \
                | head -n 200 \
                | tee "${root}/candidate-objects.jsonl"
              echo
              echo "===== RELEVANT STRING VALUES ====="
              jq -r ".. | strings | select(test(\"linux|x64|client|package|current|\\.tar|\\.zip|\\.json\"; \"i\"))" \
                "${root}/tibiametadata.json" \
                | sort -u \
                | head -n 300 \
                | tee "${root}/relevant-strings.txt"
            '
