name: Tibia Linux client report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-client-report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Diagnose persisted Linux client analysis
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Print client analysis directory only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              set -eu
              apk add --no-cache coreutils file findutils jq xz >/dev/null

              echo "===== CLIENT ANALYSIS DIRECTORIES ====="
              if test -d /analysis/client-analysis; then
                find /analysis/client-analysis -maxdepth 5 -print | sort
              else
                echo "client-analysis directory missing"
              fi
              echo

              echo "===== CLIENT ANALYSIS FILES ====="
              if test -d /analysis/client-analysis; then
                find /analysis/client-analysis -type f -exec stat -c "%s %n" {} \; | sort -n
              fi
              echo

              echo "===== CLIENT-LIKE FILE HASHES ====="
              find /analysis -type f \( -name client -o -name client.lzma \) -print | sort | while IFS= read -r path; do
                stat -c "size=%s path=%n" "${path}"
                sha256sum "${path}"
                file "${path}"
              done
              echo

              manifest_run="$(cat /analysis/latest-package-manifest-run-id)"
              manifest="/analysis/package-manifests/${manifest_run}/package.json"
              echo "===== EXPECTED CLIENT RECORD ====="
              jq -c '.files[] | select(.localfile == "bin/client")' "${manifest}"
            '
