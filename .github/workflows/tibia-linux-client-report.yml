name: Tibia Linux client report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tibia-linux-client-report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Read persisted Linux client analysis
    runs-on: oteryn-staging
    timeout-minutes: 7

    steps:
      - name: Print verified client report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount 'type=volume,src=oteryn-tibia-linux-analysis,dst=/analysis,readonly' \
            alpine:3.22 \
            sh -lc '
              set -eu
              apk add --no-cache binutils coreutils file grep >/dev/null

              run_id="$(cat /analysis/latest-client-analysis-run-id)"
              root="/analysis/client-analysis/${run_id}"
              report="${root}/report"
              client="${root}/download/client"

              echo "run_id=${run_id}"
              echo "===== FILES ====="
              find "${root}" -maxdepth 3 -type f -exec stat -c "%s %n" {} \; | sort -n
              echo
              echo "===== VERIFIED CLIENT ====="
              stat -c "size=%s" "${client}"
              sha256sum "${client}"
              file "${client}"
              echo
              echo "===== SUMMARY ====="
              test ! -f "${report}/summary.txt" || cat "${report}/summary.txt"
              echo
              echo "===== ELF HEADER ====="
              test ! -f "${report}/elf-header.txt" || cat "${report}/elf-header.txt"
              echo
              echo "===== DEPENDENCIES ====="
              if test -f "${report}/dynamic.txt"; then
                grep -E "NEEDED|RPATH|RUNPATH" "${report}/dynamic.txt" || true
              fi
              echo
              echo "===== MATCH COUNTS ====="
              if test -f "${report}/strings.txt"; then
                printf "battleye="
                grep -Eic "battleye|beclient|beservice|--battleye" "${report}/strings.txt" || true
                printf "protected_unprotected="
                grep -Eic "protected|unprotected|anticheat|anti-cheat" "${report}/strings.txt" || true
                printf "auth_fields="
                grep -Eic "loginservice|sessionkey|clienttype|clientversion|assetversion|two.?factor|loginconfirmation|trusteddevice|devicecookie|masslogin" "${report}/strings.txt" || true
              fi
              echo
              echo "===== SECURITY AND AUTH STRINGS ====="
              if test -f "${report}/strings.txt"; then
                grep -Ei "battleye|beclient|beservice|--battleye|protected|unprotected|anticheat|anti-cheat|loginservice|sessionkey|clienttype|clientversion|assetversion|two.?factor|loginconfirmation|trusteddevice|devicecookie|masslogin" "${report}/strings.txt" \
                  | sort -u \
                  | head -n 400 || true
              fi
              echo
              echo "===== URLS ====="
              test ! -f "${report}/urls.txt" || head -n 300 "${report}/urls.txt"
            '
